<body><header class="top"><strong>MY MUSIC CLASS · 교사용 45분 이야기형 지도안</strong><div><button onclick="window.print()">인쇄 · PDF 저장</button> <a href="../">수업자료실</a></div></header>
<main id="document"><h1>수업 자료를 확인하고 있습니다.</h1><p>이야기형 수업 데이터가 불러와지지 않을 때에는 기존 교사용 지도안을 이용하세요.</p></main>
<script>
(async()=>{

 const r=await fetch("../"+id+"/deck.json",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);

 n("h1","",d.title,host);n("p","meta",d.goal,host);
 const mission=n("section","mission",null,host);
 n("strong","",(d.story?.role||"음악 이야기")+" · "+(d.story?.mission||""),mission);
 n("p","","도입에서 던지는 질문: "+(d.story?.hook||d.slides[0].prompt),mission);
 n("p","","끝에 도달할 결론: "+(d.story?.payoff||d.slides.at(-1).prompt),mission);

 for(const [val,key] of [[d.slides.length+"장면","발표 화면"],["45분","교실 운영"],[d.slides.reduce((a,s)=>a+s.music,0)+"분","계획상 음악 활동"]]){
   const f=n("div","fact",null,facts);n("strong","",val,f);n("small","",key,f);
 }
 const h2=n("h2","","교사 진행표 · 도입 → 단서 → 실연 → 이야기의 결말",host);

 for(const t of ["시간","장면 / 장르","학생 참여 · 음악 활동","교사 발문 · 주의"])n("th","",t,tr);

 for(let i=0;i<d.slides.length;i++){
   const s=d.slides[i],row=n("tr","",null,body);
   n("td","",t+"–"+(t+s.min)+"분 ("+s.min+"분)",row);
   const label=n("td","",null,row);n("b","story",String(i+1).padStart(2,"0")+" · "+(s.storyBeat||s.phase),label);n("div","",s.title,label);
   const stu=n("td","",null,row);n("strong","",s.studentCue||s.prompt,stu);
   const list=n("ul","",null,stu);for(const task of s.tasks||[])item(list,task);
   const teacher=n("td","",null,row);
   n("p","",s.prompt,teacher);n("p","note",s.teacher,teacher);
   t+=s.min;
 }
 n("h2","","형성평가와 학습 지원",host);
 const support=n("ul","",null,host);
 item(support,"전원이 먼저 손 신호·허밍·손뼉으로 참여하고, 필요할 때만 대표 학생의 답을 공유합니다.");
 item(support,"감상은 들은 소리를 근거로, 연주·창작은 개별 표현과 수정 근거로 확인합니다. 태도·큰 성량·빠른 정답은 점수화하지 않습니다.");
 item(support,"변성기 또는 신체·감각적 어려움이 있으면 낮은 조·허밍·몸짓·카드 응답 등 동등한 대안을 제공합니다.");
 item(support,"발표 PPT형 16:9 모드와 원래 HTML 활동 모드를 교차 활용하되, 깊이 있는 실연은 충분히 연속된 시간을 확보합니다.");
 n("h2","","음원 및 학교망 사전 점검",host);
 n("p","warning",d.sourceNote||"실제 음원과 공연 영상은 학교망에서 재생이 차단될 수 있으므로 사전 점검이 필요합니다.",host);
 const backup=n("ul","",null,host);

 item(backup,"외부 영상 차단 시 교사의 짧은 실연 시범과 원래 HTML 화면에 있는 대체 자료로 진행합니다. 실제 음원 감상을 수행하지 못했다면 감상 성취를 완료했다고 평가하지 않습니다.");

 n("p","small","본 문서는 동일한 deck.json에서 자동 구성되므로 학생용 발표 흐름과 시간표가 일치합니다.",host);
}catch(err){host.replaceChildren();n("h1","","수업 데이터를 불러오지 못했습니다.",host);n("p","",String(err),host);const a=n("a","","기존 교사용 지도안으로 이동",host);a.href="../"+id+"/teacher.html"}
})();
