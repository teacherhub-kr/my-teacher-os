<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4박 리듬 실험실 | MY TEACHER OS</title><style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#eaf5ff;background:#081627}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#21436a,#081627 50%);min-height:100vh}button,a{font:inherit}button{cursor:pointer;border:1px solid #53718c;border-radius:12px;background:#183451;color:white;padding:12px 17px}button:hover,button:focus-visible{outline:2px solid #57d8ce}button.active,.primary{background:#0d978d;border-color:#38d9c9;color:white}a{color:#83e9df}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.eyebrow{color:#7adfd8;font-size:14px;font-weight:800}h1{font-size:clamp(30px,5vw,54px);margin:9px 0}p{line-height:1.7}.muted{color:#b2c6d8}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:20px}.nav{display:grid;align-content:start;gap:7px}.nav button{text-align:left}.stage{border:1px solid #385c78;background:#11263e;border-radius:24px;padding:clamp(18px,4vw,36px);min-height:520px}.stage h2{font-size:clamp(26px,4vw,40px)}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:99px;padding:6px 12px;background:#21445b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.beat{min-height:108px;font-size:25px;font-weight:900;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}.beat small{font-size:13px}.beat.on{background:#14a89c;color:#051c26}.beat.off{background:#29384a}.actions{display:flex;gap:10px;flex-wrap:wrap}.answer{display:block;text-align:left;width:100%;margin:9px 0}.feedback{padding:14px;border-left:4px solid #5de0cd;background:#204259;border-radius:8px;margin:14px 0}.guide{margin-top:16px;background:#203b53;padding:18px;border-radius:14px}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.bar{height:7px;background:#31536a;border-radius:99px;overflow:hidden;margin-top:14px}.bar span{display:block;height:100%;background:#55e0ce}.footer{font-size:13px;color:#a4bed0;margin:25px 0}.hidden{display:none}.quiz button.correct{background:#168d72}.quiz button.wrong{background:#8d4254}input[type=range]{width:200px} @media(max-width:750px){.layout{grid-template-columns:1fr}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.grid{gap:6px}.beat{min-height:85px;padding:7px}}@media print{body{background:white;color:black}.nav,.actions,.bottom,.top button{display:none}.stage{border:0;color:black}}
</style></head><body><div class="wrap"><header class="top"><div><div class="eyebrow">MY TEACHER OS · 중학교 2학년 · 2022 개정 · 45분</div><h1>🥁 4박 리듬 실험실</h1><div class="muted">쉼으로 만드는 그루브 · 창작과 표현</div></div><div class="actions"><a href="../">수업자료실</a><a href="teacher.html" target="_blank" rel="noopener">교사용 지도안 ↗</a><button id="teacherBtn" aria-expanded="false">교사 설명 보기</button><button id="fullBtn">전체화면</button></div></header><div class="bar"><span id="progress"></span></div><div class="layout"><nav class="nav" id="nav" aria-label="수업 장면"></nav><main class="stage"><div class="chips"><span class="chip" id="sceneTime"></span><span class="chip" id="elapsed">수업 타이머 00:00</span><button id="timerBtn">타이머 시작</button></div><section id="content" aria-live="polite"></section><aside id="guide" class="guide" hidden></aside><div class="bottom"><button id="prev">← 이전</button><strong id="counter"></strong><button id="next" class="primary">다음 →</button></div></main></div><div class="footer">브라우저에서 합성 클릭음을 생성합니다. 실제 악기 녹음이 아닙니다. 로그인·학생정보 수집·저장·전송 없음. 소리가 나지 않으면 '소리 켜기'를 누르세요.</div></div><script>
"use strict";
const scenes=[
["도입",4,"소리와 쉼의 차이","같은 4박에서도 쉼의 위치가 바뀌면 느낌이 달라질까요?","박은 일정하게 반복되는 시간의 기준이며 쉼은 소리를 내지 않는 길이입니다.","박과 리듬은 어떻게 다른가요?","박은 일정한 기준, 리듬은 음과 쉼의 길이와 배열입니다."],
["박 느끼기",4,"4박을 몸으로 세기","하나·둘·셋·넷을 일정하게 세고 손뼉으로 표현해 봅시다.","속도는 일정하게 유지하고 소리의 유무만 바꿉니다.","박이 일정해야 하는 이유는?","다른 사람이 같은 시간 기준으로 연주할 수 있기 때문입니다."],
["쉼 찾기",5,"쉼이 만드는 대비","소리-소리-쉼-소리를 입으로 읽고 손뼉으로 표현해 봅시다.","쉼도 시간은 지나갑니다. 쉼표는 박을 없애는 기호가 아닙니다.","쉼에서는 시간이 멈추나요?","아니요. 소리를 내지 않을 뿐 박은 계속됩니다."],
["패턴 비교",5,"리듬 두 가지 비교","같은 8박 길이에서 쉼의 위치를 바꿔 들어 봅시다.","A와 B의 총 길이는 같고 소리의 배열만 다릅니다.","어느 부분에서 다른 느낌이 났나요?","쉼이 놓인 위치와 소리가 다시 시작되는 순간입니다."],
["리듬 편집",7,"나만의 8박 만들기","격자를 눌러 소리 ● / 쉼 ○을 바꾸고 재생해 봅시다.","4박 두 마디, 각 칸은 4분음표 한 박입니다. 8분음표 분할은 이번 차시에 다루지 않습니다.","쉼을 최소 한 번 넣었나요?","쉼을 넣고도 8박 길이를 유지할 수 있습니다."],
["연주 실험",5,"속도를 바꾸어 비교","같은 리듬을 느리게, 빠르게 연주해 보세요.","빠르기를 바꾸어도 음·쉼의 순서는 같습니다.","빠르기 변화가 리듬 배열을 바꾸나요?","아니요. 같은 패턴을 다른 템포로 연주한 것입니다."],
["짝 연주",5,"친구와 리듬 나누기","한 명은 박을 세고 다른 한 명은 자신의 패턴을 연주합니다.","서로의 연주를 듣고 쉼의 위치를 말해 봅니다. 채점은 개별 응답으로 확인합니다.","친구의 리듬에서 쉼은 어디에 있나요?","직접 들은 소리를 근거로 박 번호를 말합니다."],
["개별 확인",5,"개념 퀴즈 3문항","정답을 고르면 즉시 해설이 나옵니다.","퀴즈는 형성평가이며 공식 수행평가 점수에 반영하지 않습니다.","쉼표의 기능을 설명해 보세요.","정해진 길이 동안 소리를 내지 않는 것입니다."],
["창작 설명",3,"내가 쉼을 넣은 이유","내 리듬에서 쉼의 위치를 선택한 이유를 말해 봅시다.","소리와 쉼의 대비, 반복, 기대감 등 음악적 근거를 제시합니다.","쉼의 위치를 바꾸면 무엇이 달라질까요?","리듬의 흐름과 강조되는 순간이 달라집니다."],
["종료 티켓",2,"오늘 배운 것 한 문장","‘쉼은 ______이지만 박은 ______이다.’ 문장을 완성해 봅시다.","쉼은 소리가 없는 시간이지만 박은 계속됩니다.","다음 시간에 무엇을 확장할까요?","8분음표로 한 박을 둘로 나누는 리듬을 탐색합니다."]
];
const quiz=[["쉼표가 있는 동안 박은 어떻게 되나요?",["박이 사라진다","박은 계속되고 소리만 쉬어진다","빠르기가 두 배가 된다"],1,"쉼은 소리를 내지 않는 시간이며 박은 유지됩니다."],["4분음표 한 개와 4분쉼표 한 개의 길이는?",["같다","항상 다르다","쉼표는 길이가 없다"],0,"4/4박자에서 두 기호 모두 한 박 길이입니다."],["같은 8박 리듬에서 쉼 위치를 바꾸면?",["총 박수가 바뀐다","항상 똑같이 들린다","소리의 배열과 느낌이 달라질 수 있다"],2,"총 8박은 유지하면서 리듬의 배열을 바꿀 수 있습니다."]];
let scene=0,teacher=false,pattern=[1,1,0,1,1,0,1,1],tempo=90,audio=null,playing=false,playTimers=[],answers={},elapsed=0,ticking=null;
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stop(){playing=false;playTimers.forEach(clearTimeout);playTimers=[]}
function audioReady(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();return true}catch(e){alert("이 브라우저에서는 소리 합성을 사용할 수 없습니다. 손뼉으로 연주하세요.");return false}}
function clickSound(accent=false){if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.setValueAtTime(accent?950:700,t);o.frequency.exponentialRampToValueAtTime(accent?550:390,t+.07);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.12)}
function play(p){stop();if(!audioReady())return;playing=true;const ms=60000/tempo; p.forEach((v,i)=>playTimers.push(setTimeout(()=>{if(v)clickSound(i%4===0)},i*ms)));playTimers.push(setTimeout(()=>playing=false,p.length*ms+120))}
function grid(){return '<div class="grid">'+pattern.map((v,i)=>'<button class="beat '+(v?'on':'off')+'" data-beat="'+i+'" aria-pressed="'+!!v+'"><small>'+(i<4?'1마디':'2마디')+' · '+(i%4+1)+'박</small>'+(v?'●':'○')+'<small>'+(v?'소리':'쉼')+'</small></button>').join('')+'</div>'}
function quizHtml(){return '<div class="quiz">'+quiz.map((q,i)=>'<div class="guide"><strong>'+(i+1)+'. '+escapeHtml(q[0])+'</strong>'+q[1].map((a,j)=>'<button class="answer '+(answers[i]!==undefined?(j===q[2]?'correct':j===answers[i]?'wrong':''):'')+'" data-quiz="'+i+'" data-answer="'+j+'">'+escapeHtml(a)+'</button>').join('')+(answers[i]!==undefined?'<div class="feedback">'+(answers[i]===q[2]?'✓ 정답':'다시 생각해 봅시다')+' · '+escapeHtml(q[3])+'</div>':'')+'</div>').join('')+'</div>'}
function render(){const s=scenes[scene];$('nav').innerHTML=scenes.map((x,i)=>'<button data-scene="'+i+'" class="'+(i===scene?'active':'')+'">'+(i+1)+'. '+escapeHtml(x[0])+' <small>'+x[1]+'분</small></button>').join('');$('sceneTime').textContent=s[0]+' · '+s[1]+'분';$('counter').textContent=(scene+1)+' / '+scenes.length;$('progress').style.width=(scene+1)*10+'%';$('prev').disabled=scene===0;$('next').disabled=scene===9;let h='<h2>'+escapeHtml(s[2])+'</h2><p>'+escapeHtml(s[3])+'</p>';
if([3,4,5,6].includes(scene)){h+='<div class="actions"><button data-play="a">▶ 패턴 A</button><button data-play="b">▶ 패턴 B</button><button data-play="mine" class="primary">▶ 내 리듬 재생</button><button data-stop="1">■ 정지</button></div>'+grid()+'<div class="actions"><label>빠르기 <strong id="bpm">'+tempo+'</strong> BPM <input id="tempo" type="range" min="60" max="140" step="5" value="'+tempo+'"></label><button data-reset="1">기본 리듬으로</button></div><p class="muted">각 칸은 4분음표 한 박입니다. 소리와 쉼을 눌러 바꾸세요. 클릭음은 브라우저가 생성한 합성음입니다.</p>'}
if(scene===7)h+=quizHtml();
if(scene===8)h+='<p class="feedback">예: “셋째 박을 쉬어서 다음 박의 시작이 더 뚜렷하게 들리도록 했습니다.”</p>'+grid();
if(scene===9)h+='<div class="feedback">모범 답: 쉼은 <strong>소리가 없는 시간</strong>이지만 박은 <strong>계속된다</strong>.</div><p>다음 차시: 8분음표와 박의 분할</p>';
$('content').innerHTML=h;$('guide').innerHTML='<h3>👩‍🏫 교사 설명</h3><p><strong>지도:</strong> '+escapeHtml(s[4])+'</p><p><strong>발문:</strong> '+escapeHtml(s[5])+'</p><p><strong>예상 답:</strong> '+escapeHtml(s[6])+'</p>';$('guide').hidden=!teacher}
function goto(i){if(i<0||i>=scenes.length)return;stop();scene=i;render();scrollTo({top:0,behavior:"smooth"})}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-scene]');if(b)goto(+b.dataset.scene)});
$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.beat!==undefined){pattern[+b.dataset.beat]^=1;render()}else if(b.dataset.play){play(b.dataset.play==='a'?[1,1,0,1,1,0,1,1]:b.dataset.play==='b'?[1,0,1,1,0,1,1,0]:pattern)}else if(b.dataset.stop)stop();else if(b.dataset.reset){pattern=[1,1,0,1,1,0,1,1];render()}else if(b.dataset.quiz!==undefined){answers[+b.dataset.quiz]=+b.dataset.answer;render()}});
$('content').addEventListener('input',e=>{if(e.target.id==='tempo'){tempo=+e.target.value;$('bpm').textContent=tempo}});
$('teacherBtn').onclick=()=>{teacher=!teacher;$('teacherBtn').textContent=teacher?'교사 설명 숨기기':'교사 설명 보기';$('teacherBtn').setAttribute('aria-expanded',String(teacher));render()};
$('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
$('prev').onclick=()=>goto(scene-1);$('next').onclick=()=>goto(scene+1);
$('timerBtn').onclick=()=>{if(ticking){clearInterval(ticking);ticking=null;$('timerBtn').textContent="타이머 계속"}else{ticking=setInterval(()=>{elapsed++;$('elapsed').textContent='수업 타이머 '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')},1000);$('timerBtn').textContent="타이머 일시정지"}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>
