["도입 · 리듬을 발견하다",4,"음악에서 리듬을 찾아라!","영화의 긴장감, 춤의 움직임, 친구의 발걸음. 음악에서 반복되는 길고 짧은 흐름을 찾아보세요.","드라이브 ‘리듬감 향상’ 자료의 리듬 개념과 도입 발문을 참고. 소리의 길이와 쉼이 만드는 흐름에 집중합니다.","타악기의 주요 음악 요소는 무엇인가요?","리듬입니다. 선율·빠르기·셈여림도 음악의 중요한 요소입니다."],

["코다이 리듬 읽기",5,"타 · 티티 · 쉿","타(♩), 티티(♫), 쉿(𝄽)을 입으로 읽고 손뼉으로 표현해 봅시다.","드라이브 ‘리듬 청음 연습’과 ‘바디퍼커션 2차시’의 코다이 음절을 활용. 타=한 박, 티티=반 박씩 둘, 쉿=한 박 쉼.","티티 두 음을 합치면 몇 박인가요?","한 박입니다. 티티 각각은 반 박입니다."],

["몸이 악기가 되는 순간",5,"바디퍼커션 에코 놀이","교사가 손뼉·무릎·발 구르기로 만든 4박 리듬을 듣고 그대로 따라 해 보세요.","드라이브 ‘바디퍼커션 2차시’의 에코놀이·신체타악기 활동 참고. 소리의 크기와 신체 부담을 조절합니다.","같은 리듬을 다른 신체 소리로 연주하면?","리듬은 같아도 음색이 달라집니다."],

const drumFiles={clap:"clap",knee:"conga-l",foot:"kick",snare:"snare",bass:"kick",hat:"hihat",shaker:"cabasa",cowbell:"cowbell"};const drumBuffers={};let loadingDrums=false;async function loadDrums(){if(loadingDrums)return;loadingDrums=true;if(!initAudio())return;const names=Object.keys(drumFiles);await Promise.all(names.map(async name=>{try{const url="https://oramics.github.io/sampled/DM/LM-2/samples/"+drumFiles[name]+".wav";const response=await fetch(url);if(!response.ok)throw Error("HTTP "+response.status);drumBuffers[name]=await audio.decodeAudioData(await response.arrayBuffer())}catch(e){console.warn("음원 로드 실패",name,e)}}));loadingDrums=false;const el=document.getElementById("audioStatus");if(el)el.textContent="실제 음원 준비: "+Object.keys(drumBuffers).length+"/8종"}function sound(kind){if(!audio)return;const buffer=drumBuffers[kind];if(!buffer){loadDrums();return}const src=audio.createBufferSource();src.buffer=buffer;src.connect(audio.destination);src.start()}
async function awaitSound(kind){await loadDrums();sound(kind)}
function play(p,kind=instrument){stop();if(!initAudio())return;loadDrums();const beat=60000/tempo;for(let m=0;m<2;m++)for(let i=0;i<4;i++){let v=p[m][i],index=m*4+i,delay=index*beat;timers.push(setTimeout(()=>{activeBeat=index;document.querySelectorAll("[data-slot]").forEach(x=>x.classList.toggle("playing",+x.dataset.slot===index));if(v==="ta")sound(kind,i===0);if(v==="titi"){sound(kind,i===0);timers.push(setTimeout(()=>sound(kind),beat/2))}},delay))}timers.push(setTimeout(stop,8*beat+100))}
function notation(p){return p.map((row,m)=>'<div class="measure"><div class="measureHead">'+(m+1)+'마디 <span>4/4</span></div><div class="grid">'+row.map((v,i)=>'<div class="beat '+(activeBeat===m*4+i?'playing':'')+'" data-slot="'+(m*4+i)+'"><small>'+(i+1)+'박</small><span class="symbol">'+({ta:"♩",titi:"♫",rest:"𝄽"}[v])+'</span><strong>'+({ta:"타",titi:"티티",rest:"쉿"}[v])+'</strong></div>').join('')+'</div></div>').join('')}
function editor(){return '<div class="score">'+grid.map((row,m)=>'<div class="measure"><div class="measureHead">'+(m+1)+'마디 <span>4/4</span></div><div class="grid">'+row.map((v,i)=>'<button class="beat editable" data-edit="'+m+'-'+i+'" data-slot="'+(m*4+i)+'" aria-label="'+(m+1)+'마디 '+(i+1)+'박 '+v+' 다음 기호로 변경"><small>'+(i+1)+'박 · 탭하여 변경</small><span class="symbol">'+({ta:"♩",titi:"♫",rest:"𝄽"}[v])+'</span><strong>'+({ta:"타",titi:"티티",rest:"쉿"}[v])+'</strong></button>').join('')+'</div></div>').join('')+'</div>'}
function controls(){return '<div class="controlPanel"><div class="actions"><button data-play="a">▶ 패턴 A 듣기</button><button data-play="b">▶ 패턴 B 듣기</button><button data-play="mine" class="primary">▶ 내 작품 듣기</button><button data-stop="1">■ 정지</button></div><div class="actions"><label>빠르기 <strong id="bpm">'+tempo+'</strong> BPM <input id="tempo" type="range" min="60" max="140" step="5" value="'+tempo+'"></label><label>소리 선택 <select id="instrument"><option value="clap" '+(instrument==="clap"?"selected":"")+'>👏 손뼉</option><option value="knee" '+(instrument==="knee"?"selected":"")+'>🦵 무릎</option><option value="foot" '+(instrument==="foot"?"selected":"")+'>🦶 발 구르기</option></select></label></div><p class="muted">※ 인터넷 음원 사용 · 손뼉/발/무릎은 드럼머신 타격음으로 대체합니다. 음원 재생이 안 되면 네트워크를 확인하세요.</p></div>'}
function quizHtml(){return q.map((x,i)=>'<div class="question"><strong>'+(i+1)+'. '+esc(x[0])+'</strong>'+x[1].map((a,j)=>'<button class="answer '+(answers[i]!==undefined?(j===x[2]?"correct":j===answers[i]?"wrong":""):"")+'" data-q="'+i+'" data-a="'+j+'">'+esc(a)+'</button>').join('')+(answers[i]!==undefined?'<div class="feedback">'+(answers[i]===x[2]?"✓ 정답":"다시 확인")+' · '+esc(x[3])+'</div>':"")+'</div>').join('')}
function render(){const s=scenes[scene];$("nav").innerHTML=scenes.map((x,i)=>'<button data-scene="'+i+'" class="'+(i===scene?"active":"")+'">'+(i+1)+'. '+esc(x[0])+' <small>'+x[1]+'분</small></button>').join('');$("sceneTime").textContent=s[0]+' · '+s[1]+'분';$("counter").textContent=(scene+1)+' / '+scenes.length;$("progress").style.width=(scene+1)*10+'%';$("prev").disabled=scene===0;$("next").disabled=scene===9;let h='<div class="eyebrow">MUSIC LAB · '+esc(s[0])+'</div><h2>'+esc(s[2])+'</h2><p class="lead">'+esc(s[3])+'</p>';
if(scene===0)h+='<div class="feedback" id="audioStatus">🎧 실제 악기 음원을 준비 중입니다. 악기를 눌러 먼저 소리를 확인하세요.</div>';if(scene===0)h+="<section class=\"gallery\"><h3>🥁 타악기 소리 탐험</h3><div class=\"soundCards\"><button data-sound=\"clap\">👏<b>손뼉</b><small>▶ 소리 듣기</small></button><button data-sound=\"knee\">🦵<b>무릎</b><small>▶ 소리 듣기</small></button><button data-sound=\"foot\">🦶<b>발</b><small>▶ 소리 듣기</small></button><button data-sound=\"snare\">🥁<b>스네어</b><small>▶ 소리 듣기</small></button><button data-sound=\"bass\">🥁<b>킥드럼</b><small>▶ 소리 듣기</small></button><button data-sound=\"hat\">✨<b>하이햇</b><small>▶ 소리 듣기</small></button><button data-sound=\"shaker\">🪇<b>셰이커</b><small>▶ 소리 듣기</small></button><button data-sound=\"cowbell\">🔔<b>카우벨</b><small>▶ 소리 듣기</small></button></div></section><section class=\"videoPanel\"><h3>🎬 바디퍼커션 실제 영상</h3><p>손뼉·무릎·발 구르기를 따라 연주해 보세요.</p><iframe loading=\"lazy\" title=\"Body Percussion\" src=\"https://www.youtube-nocookie.com/embed/ZH89VCmz1ts\" allowfullscreen></iframe><p><a href=\"https://www.youtube.com/watch?v=ZH89VCmz1ts\" target=\"_blank\" rel=\"noopener noreferrer\">영상이 안 나오면 YouTube에서 보기</a></p></section>";if(scene===0)h+='<div class="concepts"><div>🎬 <b>영화</b><span>긴장감을 만드는 리듬</span></div><div>💃 <b>춤</b><span>몸을 움직이는 비트</span></div><div>🥁 <b>타악기</b><span>길고 짧은 소리의 흐름</span></div></div><div class="challenge">오늘의 질문: 쉼도 음악이 될 수 있을까요?</div>';
if(scene===1)h+=controls()+'<div class="challenge">4박을 세며 ① 손뼉 ② 무릎 ③ 발 구르기 순서로 바꿔 보세요.</div>'+notation(patterns.a);
if(scene===2)h+='<div class="concepts"><div><span class="huge">♩</span><b>타</b><span>4분음표 · 1박</span></div><div><span class="huge">♫</span><b>티티</b><span>8분음표 2개 · 1박</span></div><div><span class="huge">𝄽</span><b>쉿</b><span>4분쉼표 · 1박</span></div></div>'+notation(patterns.echo)+'<div class="challenge">입으로 읽기 → 손뼉 치기 → 소리 없이 마음속으로 박 세기</div>';
if(scene===3)h+=controls()+'<div class="challenge">① 눈을 감고 A 듣기 ② B 듣기 ③ 쉼의 위치를 말한 뒤 악보로 확인</div><h3>패턴 A</h3>'+notation(patterns.a)+'<h3>패턴 B</h3>'+notation(patterns.b);
if(scene===4)h+='<div class="feedback" id="audioStatus">🎧 악기 선택 버튼을 눌러 실제 음원을 불러오세요.</div>';if(scene===4)h+="<section class=\"videoPanel\"><h3>🎬 바디퍼커션 실제 영상</h3><p>손뼉·무릎·발 구르기를 따라 연주해 보세요.</p><iframe loading=\"lazy\" title=\"Body Percussion\" src=\"https://www.youtube-nocookie.com/embed/ZH89VCmz1ts\" allowfullscreen></iframe><p><a href=\"https://www.youtube.com/watch?v=ZH89VCmz1ts\" target=\"_blank\" rel=\"noopener noreferrer\">영상이 안 나오면 YouTube에서 보기</a></p></section><section class=\"gallery\"><h3>🥁 타악기 소리 탐험</h3><div class=\"soundCards\"><button data-sound=\"clap\">👏<b>손뼉</b><small>▶ 소리 듣기</small></button><button data-sound=\"knee\">🦵<b>무릎</b><small>▶ 소리 듣기</small></button><button data-sound=\"foot\">🦶<b>발</b><small>▶ 소리 듣기</small></button><button data-sound=\"snare\">🥁<b>스네어</b><small>▶ 소리 듣기</small></button><button data-sound=\"bass\">🥁<b>킥드럼</b><small>▶ 소리 듣기</small></button><button data-sound=\"hat\">✨<b>하이햇</b><small>▶ 소리 듣기</small></button><button data-sound=\"shaker\">🪇<b>셰이커</b><small>▶ 소리 듣기</small></button><button data-sound=\"cowbell\">🔔<b>카우벨</b><small>▶ 소리 듣기</small></button></div></section>";if(scene===4)h+='<div class="concepts"><div>👏 <b>손뼉</b><span>맑고 선명하게</span></div><div>🦵 <b>무릎</b><span>부드럽고 낮게</span></div><div>🦶 <b>발 구르기</b><span>묵직한 박</span></div></div>'+controls()+'<h3>교사 따라하기 · 에코 리듬</h3>'+notation(patterns.echo)+'<div class="challenge">듣기 → 따라하기 → 신체 소리 바꾸기 → 친구에게 에코로 들려주기</div>';
if(scene===5||scene===6)h+="<section class=\"gallery\"><h3>🥁 타악기 소리 탐험</h3><div class=\"soundCards\"><button data-sound=\"clap\">👏<b>손뼉</b><small>▶ 소리 듣기</small></button><button data-sound=\"knee\">🦵<b>무릎</b><small>▶ 소리 듣기</small></button><button data-sound=\"foot\">🦶<b>발</b><small>▶ 소리 듣기</small></button><button data-sound=\"snare\">🥁<b>스네어</b><small>▶ 소리 듣기</small></button><button data-sound=\"bass\">🥁<b>킥드럼</b><small>▶ 소리 듣기</small></button><button data-sound=\"hat\">✨<b>하이햇</b><small>▶ 소리 듣기</small></button><button data-sound=\"shaker\">🪇<b>셰이커</b><small>▶ 소리 듣기</small></button><button data-sound=\"cowbell\">🔔<b>카우벨</b><small>▶ 소리 듣기</small></button></div></section>";if(scene===5||scene===6)h+='<div class="challenge">조건: 4/4박자 두 마디(8박) · 쉼 최소 1개 · 각 칸을 눌러 타 → 티티 → 쉿으로 변경</div>'+editor()+controls()+'<div class="actions"><button data-reset="1">↺ 처음부터</button><button data-random="1">✦ 새 리듬 예시</button><button data-print="1">🖨 내 악보 인쇄</button></div>';
if(scene===7)h+=quizHtml();
if(scene===8)h+=editor()+controls()+'<div class="challenge">발표 문장: “저는 ___번째 박에 쉼을 넣어 ___하는 느낌을 표현했습니다.”</div>';
if(scene===9)h+='<div class="challenge">쉼은 <b>소리가 없는 시간</b>이지만 박은 <b>계속된다</b>.</div><div class="concepts"><div><span class="huge">♩</span><b>타</b><span>1박</span></div><div><span class="huge">♫</span><b>티티</b><span>반 박씩 둘</span></div><div><span class="huge">𝄽</span><b>쉿</b><span>1박 쉼</span></div></div><p>다음 차시: 리듬을 연결해 4마디 작품으로 확장하기</p>';
$("content").innerHTML=h;$("guide").innerHTML='<h3>👩‍🏫 교사용 장면 설명</h3><div class="guideCards"><div><b>수업 진행</b><p>'+esc(s[4])+'</p></div><div><b>교사 발문</b><p>'+esc(s[5])+'</p></div><div><b>예상 답변</b><p>'+esc(s[6])+'</p></div></div>';$("guide").hidden=!teacher}
function goto(i){if(i<0||i>=scenes.length)return;stop();scene=i;render();scrollTo({top:0,behavior:"smooth"})}
$("nav").onclick=e=>{let b=e.target.closest("[data-scene]");if(b)goto(+b.dataset.scene)};
$("content").onclick=e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.edit){let [m,i]=b.dataset.edit.split("-").map(Number);grid[m][i]={ta:"titi",titi:"rest",rest:"ta"}[grid[m][i]];render()}else if(b.dataset.sound){instrument=b.dataset.sound;awaitSound(instrument)}else if(b.dataset.play){play(b.dataset.play==="a"?patterns.a:b.dataset.play==="b"?patterns.b:grid)}else if(b.dataset.stop)stop();else if(b.dataset.reset){grid=[["ta","titi","rest","ta"],["ta","rest","titi","ta"]];render()}else if(b.dataset.random){const v=["ta","titi","rest"];grid=Array.from({length:2},()=>Array.from({length:4},()=>v[Math.floor(Math.random()*3)]));if(!grid.flat().includes("rest"))grid[0][2]="rest";render()}else if(b.dataset.print)print();else if(b.dataset.q!==undefined){answers[+b.dataset.q]=+b.dataset.a;render()}};
$("content").oninput=e=>{if(e.target.id==="tempo"){tempo=+e.target.value;$("bpm").textContent=tempo}else if(e.target.id==="instrument")instrument=e.target.value};
$("teacherBtn").onclick=()=>{teacher=!teacher;$("teacherBtn").textContent=teacher?"교사 설명 숨기기":"교사 설명 보기";$("teacherBtn").setAttribute("aria-expanded",String(teacher));render()};
$("fullBtn").onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
$("prev").onclick=()=>goto(scene-1);$("next").onclick=()=>goto(scene+1);
$("timerBtn").onclick=()=>{if(clock){clearInterval(clock);clock=null;$("timerBtn").textContent="타이머 계속"}else{clock=setInterval(()=>{elapsed++;$("elapsed").textContent="수업 타이머 "+String(Math.floor(elapsed/60)).padStart(2,"0")+":"+String(elapsed%60).padStart(2,"0")},1000);$("timerBtn").textContent="타이머 일시정지"}};
document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()});render();
</script></body></html>
