*{box-sizing:border-box}body{margin:0;background:#0c1425;color:#f5f7ff;font-family:system-ui,'Malgun Gothic',sans-serif;font-size:19px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:14px 18px;background:#8ce7d7;color:#102d39;font-weight:800}button:hover,button:focus-visible{outline:3px solid #ffcc66}button:disabled{opacity:.4}header{padding:20px max(22px,calc((100% - 1450px)/2));background:#17223a;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:2px solid #385476}header h1{font-size:clamp(27px,3vw,44px);margin:5px 0}header p{margin:0;color:#b9d2e8}.shell{max-width:1500px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:240px 1fr;gap:20px}nav{display:flex;flex-direction:column;gap:8px}nav button{background:#1b2b44;color:#d5e4f5;text-align:left;font-size:18px;padding:14px}nav button.active{background:#b4f1e4;color:#092d35}.main{min-width:0}.hero{background:linear-gradient(120deg,#214b79,#154e5c);padding:28px;border-radius:24px;margin-bottom:18px}.hero h2{font-size:clamp(32px,4vw,52px);margin:5px 0}.hero p{font-size:23px;line-height:1.55}.eyebrow{font-size:17px;color:#aaf1e7;font-weight:900}.panel{background:#1b2941;border:1px solid #3c5374;border-radius:22px;padding:25px;margin:18px 0}.panel h3{font-size:29px;margin:0 0 15px}.panel p{line-height:1.65}.status{background:#293c57;padding:15px 20px;border-radius:13px;margin:12px 0;font-weight:750}.ok{border-left:6px solid #5be4b2}.bad{border-left:6px solid #ff9b83}.toolbar{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.toolbar label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input[type=range]{width:140px;accent-color:#56e1cf}.toolbar select{background:#e6f5ff;color:#12324b;padding:10px;border-radius:12px}.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.pad{background:linear-gradient(145deg,#29446b,#20354f);color:white;min-height:165px;border:2px solid #4d space:nowrap}.pads{grid-template-columns:repeat(2,1fr)}.measures{grid-template-columns:1fr}.lessonSteps{grid-template-columns:1fr}}@media(max-width:480px){.pad{min-height:125px;font-size:39px}.panel{padding:16px}.beat b{font-size:28px}}
</style></head><body><header><div><div class="eyebrow">2022 개정 음악과 · 중학교 · 45분</div><h1>🥁 리듬 스튜디오</h1><p>듣고 · 구별하고 · 만들고 · 음악에 맞춰 연주하기</p></div><div class="toolbar"><button id="audioStart">🎧 음원 준비</button><button id="teacherToggle">👩‍🏫 교사 설명</button><button id="fullscreen">⛶ 전체화면</button></div></header><div class="shell"><nav id="nav"></nav><main class="main"><section class="hero"><div class="eyebrow" id="stepLabel"></div><h2 id="title"></h2><p id="subtitle"></p></section><div id="audioState" class="status">실제 악기 WAV 음원을 준비하려면 상단 ‘음원 준비’를 누르세요.</div><div id="body"></div><div id="teacher" class="teacher hidden"></div><div class="footer"><button id="prev">← 이전</button><span id="progress"></span><button id="next">다음 →</button></div><p class="credit">음원: <a href="https://oramics.github.io/sampled/DM/LM-2/" target="_blank" rel="noopener">LinnDrum LM-2 (Public Domain)</a> · 실제 드럼머신 녹음 샘플. 외부 음원과 영상 재생에는 인터넷 연결이 필요합니다. 학생 개인정보는 저장하지 않습니다.</p></main></div><script>
const BASE="https://oramics.github.io/sampled/DM/LM-2/samples/";
const sounds=[["kick","kick.wav","🥁","킥드럼","묵직한 저음"],["snare","snare-m.wav","🥁","스네어","날카로운 타격"],["clap","clap.wav","👏","클랩","손뼉 계열"],["hat","hihat-closed.wav","✨","하이햇","짧고 높은 소리"],["cabasa","cabasa.wav","🪇","카바사","흔들어 내는 소리"],["cowbell","cowb.wav","🔔","카우벨","금속성 울림"],["tom","tom-m.wav","🪘","탐","둥근 북소리"],["tamb","tamb.wav","🪇","탬버린","찰랑거리는 소리"]];
const stages=[["리듬을 듣는 귀","음악의 리듬을 몸으로 느끼기",4,"리듬이 들리는 순간 몸은 어떻게 움직일까?","음악을 들으며 박과 리듬의 차이를 질문한다."],["악기 소리 탐험","8가지 실제 드럼머신 음색 비교",6,"악기를 바꾸면 같은 리듬도 다르게 들릴까?","음원 준비 후 소리 패드를 눌러 음색 차이를 설명하게 한다."],["4박의 심장","박을 느끼고 빠르기를 바꾸기",5,"박은 일정하게, 리듬은 다양하게!","60·90·120 BPM을 비교하고 학생과 함께 4박을 세어 본다."],["타·티티·쉿","4/4박자 리듬 읽기",5,"한 박에 소리 하나, 두 개, 또는 쉼","타=4분음표, 티티=8분음표 2개, 쉿=4분쉼표를 설명한다."],["리듬 청음 대결","같은 4박, 다른 배열을 구별하기",5,"귀로 먼저 듣고 악보를 확인하자.","패턴 A/B를 먼저 듣고 쉼의 위치와 음형을 비교한다."],["나만의 8박","두 마디 리듬 작곡하기",8,"칸을 눌러 타 → 티티 → 쉿으로 바꾸자.","8칸 중 쉼 하나 이상 넣고 음악적 의도를 설명하게 한다."],["비트와 함께","드럼 반주를 켜고 리듬 합주하기",5,"반주에 맞춰 내 리듬을 연주하자!","킥·스네어·하이햇 반주와 학생의 리듬을 겹쳐 듣는다."],["영상으로 도전","바디퍼커션 시범 보고 따라 하기",3,"보고, 듣고, 몸으로 따라 연주!","시범 영상의 박을 함께 세고 손뼉·무릎·발로 따라 한다."],["형성평가","리듬의 핵심 개념 확인",3,"소리와 쉼, 박자와 음색을 구별할 수 있나요?","학생 개인별로 정답을 선택하고 근거를 말하게 한다."],["오늘의 한 줄","내가 만든 리듬 발표와 성찰",1,"내 리듬에서 가장 마음에 드는 부분은?","짧은 발표 후 다음 차시와 연결한다."]];
const $=id=>document.getElementById(id);let stage=0,ctx=null,buffers={},failed=[],loading=null,volume=.75,bpm=90,selected="clap",playing=false,clock=[],sequence=[["ta","titi","rest","ta"],["ta","rest","titi","ta"]],answers={};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function prepare(){if(loading)return loading;loading=(async()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();$("audioState").textContent="🎧 실제 음원을 다운로드하고 있습니다…";const out=await Promise.all(sounds.map(async s=>{try{const r=await fetch(BASE+s[1]);if(!r.ok)throw Error("HTTP "+r.status);buffers[s[0]]=await ctx.decodeAudioData(await r.arrayBuffer());return true}catch(e){failed.push(s[0]);return false}}));const n=out.filter(Boolean).length;$("audioState").className="status "+(n===8?"ok":"bad");$("audioState").textContent=n===8?"✓ 실제 드럼머신 녹음 8종 준비 완료 · 소리를 눌러 확인하세요.":"⚠ 실제 음원 "+n+"/8종 준비 · 실패: "+[...new Set(failed)].join(", ")+" · 인터넷/학교망을 확인하세요.";return n}catch(e){$("audioState").textContent="⚠ 브라우저 오디오를 시작하지 못했습니다: "+e.message;return 0}finally{loading=null}})();return loading}
function hit(name,when,level=1){if(!ctx||!buffers[name])return false;const src=ctx.createBufferSource(),gain=ctx.createGain();src.buffer=buffers[name];gain.gain.value=Math.min(1,volume*level);src.connect(gain).connect(ctx.destination);src.start(when||ctx.currentTime);return true}
function stop(){playing=false;clock.forEach(clearTimeout);clock=[];document.querySelectorAll(".beat").forEach(x=>x.classList.remove("playing"));document.querySelectorAll(".lamp").forEach(x=>x.classList.remove("on"))}
async function audition(name){selected=name;await prepare();if(!hit(name)){$("audioState").textContent="⚠ "+name+" 음원을 재생할 수 없습니다. 음원 준비 상태를 확인하세요."}document.querySelectorAll(".pad").forEach(x=>x.classList.toggle("active",x.dataset.pad===name))}
function pads(){return '<div class="panel"><h3>🎧 실제 악기 음색 스튜디오</h3><p>각 악기를 눌러 실제 녹음된 소리를 들어 보세요. 선택한 악기는 아래 리듬 연주에도 적용됩니다.</p><div class="pads">'+sounds.map(s=>'<button class="pad '+(selected===s[0]?"active":"")+'" data-pad="'+s[0]+'"><span>'+s[2]+'</span><b>'+s[3]+'</b><small>'+s[4]+'</small></button>').join("")+'</div></div>'}
function transport(){return '<div class="panel"><h3>🎛️ 리듬 믹서</h3><div class="toolbar"><button data-play="mine">▶ 내 리듬</button><button data-play="groove">▶ 반주 + 내 리듬</button><button data-stop="1">■ 정지</button><label>빠르기 <strong id="bpmValue">'+bpm+'</strong> BPM <input type="range" id="bpm" min="60" max="140" step="5" value="'+bpm+'"></label><label>🔊 음량 <strong id="volValue">'+Math.round(volume*100)+'%</strong> <input type="range" id="vol" min="0" max="100" value="'+Math.round(volume*100)+'"></label></div><p class="muted">반주는 킥·스네어·하이햇 실제 샘플을 4박에 맞춰 반복합니다. 모든 소리는 선택한 음량으로 재생됩니다.</p></div>'}
function score(edit){return '<div class="measures">'+sequence.map((row,m)=>'<div class="measure"><h4>'+(m+1)+'마디 · 4/4</h4><div class="beats">'+row.map((v,i)=>'<button class="beat" '+(edit?'data-edit="'+m+'-'+i+'"':'')+' data-beat="'+(m*4+i)+'"><small>'+(i+1)+'박</small><b>'+({ta:"♩",titi:"♫",rest:"𝄽"}[v])+'</b><span>'+({ta:"타",titi:"티티",rest:"쉿"}[v])+'</span></button>').join("")+'</div></div>').join("")+'</div>'}
async function perform(mode){stop();const n=await prepare();if(n<4)return;playing=true;const beat=60/bpm;const start=ctx.currentTime+.12;for(let i=0;i<8;i++){const v=sequence[Math.floor(i/4)][i%4],at=start+i*beat;if(v!=="rest"){hit(selected,at);if(v==="titi")hit(selected,at+beat/2,.85)}if(mode==="groove"){hit("kick",at,i%4===0?1:.75);if(i%4===1||i%4===3)hit("snare",at,.8);hit("hat",at,.5);hit("hat",at+beat/2,.4)}clock.push(setTimeout(()=>{document.querySelectorAll(".beat").forEach(x=>x.classList.toggle("playing",+x.dataset.beat===i))},(at-ctx.currentTime)*1000))}clock.push(setTimeout(stop,(8*beat+.3)*1000))}
function video(){return '<div class="panel"><h3>🎬 바디퍼커션 시범 영상</h3><p>시범을 보고 박을 세며 따라 연주하세요. 영상은 별도 외부 자료이며 인터넷 연결이 필요합니다.</p><iframe class="video" loading="lazy" title="Body percussion" src="https://www.youtube-nocookie.com/embed/ZH89VCmz1ts" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe><p><a href="https://www.youtube.com/watch?v=ZH89VCmz1ts" target="_blank" rel="noopener" style="color:#9fefff">▶ YouTube에서 영상 열기</a></p></div>'}
function quiz(){const q=[["4/4박자에서 4분음표는 몇 박인가?",["반 박","한 박","두 박"],1],["티티는 무엇을 뜻하는가?",["8분음표 두 개","4분쉼표","2분음표"],0],["쉼표가 나와도 계속되는 것은?",["박의 흐름","모든 소리","연주 속도 변화"],0]];return '<div class="panel quiz"><h3>🧠 듣고 생각하는 리듬 퀴즈</h3>'+q.map((x,i)=>'<p><b>'+(i+1)+'. '+x[0]+'</b></p>'+x[1].map((a,j)=>'<button data-answer="'+i+'-'+j+'" class="'+(answers[i]===j?"chosen":"")+'">'+a+'</button>').join("")+(answers[i]!==undefined?'<p>'+(answers[i]===x[2]?"✓ 정답입니다!":"다시 생각해 보세요.")+'</p>':"")).join("")+'</div>'}
function draw(){const s=stages[stage];$("nav").innerHTML=stages.map((x,i)=>'<button data-stage="'+i+'" class="'+(i===stage?"active":"")+'">'+String(i+1).padStart(2,"0")+' · '+x[0]+' <small>('+x[2]+'분)</small></button>').join("");$("stepLabel").textContent=(stage+1)+"/10 · "+s[2]+"분";$("title").textContent=s[0];$("subtitle").textContent=s[3];$("progress").textContent=(stage+1)+"/10 · 총 45분";$("prev").disabled=stage===0;$("next").disabled=stage===9;$("teacher").innerHTML="<b>교사용 수업 진행</b><p>"+s[4]+"</p>";let h="";if(stage===0)h='<div class="panel"><div class="visual">🎶 👏 🥁</div><h3>음악을 들으면 왜 몸이 움직일까요?</h3><div class="lessonSteps"><div><b>① 듣기</b>드럼 비트 듣기</div><div><b>② 느끼기</b>네 박에 손뼉 치기</div><div><b>③ 말하기</b>박과 리듬 구별</div></div></div>'+transport();if(stage===1)h=pads()+transport();if(stage===2)h='<div class="panel"><h3>1 · 2 · 3 · 4</h3><div class="metronome">'+[0,1,2,3].map(i=>'<div class="lamp" data-lamp="'+i+'"></div>').join("")+'</div><div class="toolbar"><button data-metronome="1">▶ 4박 메트로놈</button><button data-stop="1">■ 정지</button><label>빠르기 <input id="bpm" type="range" min="60" max="140" value="'+bpm+'"><strong id="bpmValue">'+bpm+'</strong>BPM</label></div></div>'+pads();if(stage===3)h='<div class="panel"><h3>♩ 타 = 1박 · ♫ 티티 = 반 박 두 번 · 𝄽 쉿 = 1박 쉼</h3><p>쉼표가 나와도 박의 흐름은 멈추지 않습니다.</p></div>'+score(false)+transport();if(stage===4)h='<div class="panel"><h3>👂 패턴 A와 B를 귀로 비교</h3><div class="toolbar"><button data-example="a">▶ A 듣기</button><button data-example="b">▶ B 듣기</button><button data-stop="1">■ 정지</button></div><p>어느 박에서 쉼이 나오는지 말해 보세요.</p></div>'+score(false)+pads();if(stage===5)h='<div class="panel"><h3>✏️ 8박 리듬 작곡</h3><p>칸을 누를 때마다 <b>타 → 티티 → 쉿</b>으로 바뀝니다. 두 마디에 쉼을 하나 이상 넣어 보세요.</p><div class="toolbar"><button data-random="1">🎲 새 리듬</button><button data-reset="1">↺ 초기화</button><button data-print="1">🖨 인쇄</button></div></div>'+score(true)+transport()+pads();if(stage===6)h='<div class="panel"><h3>🎼 내 작품 + 드럼 반주</h3><p>킥·스네어·하이햇으로 만든 반주에 맞춰 내 리듬을 연주합니다. 빠르기를 바꿔 느낌을 비교하세요.</p></div>'+score(false)+transport()+pads();if(stage===7)h=video()+pads();if(stage===8)h=quiz();if(stage===9)h='<div class="panel"><h3>🎤 나의 리듬 발표</h3><p>“저는 ___번째 박에 ___을 넣어 ___한 느낌을 만들었습니다.”</p><p>오늘 들은 악기 중 가장 구별하기 쉬웠던 음색은 무엇인가요?</p></div>'+score(false);$("body").innerHTML=h}
async function metronome(){stop();await prepare();playing=true;const beat=60000/bpm;for(let i=0;i<16;i++){clock.push(setTimeout(()=>{if(!playing)return;hit(i%4===0?"cowbell":"hat");document.querySelectorAll(".lamp").forEach(x=>x.classList.toggle("on",+x.dataset.lamp===i%4))},i*beat))}clock.push(setTimeout(stop,16*beat))}
async function example(which){const save=sequence.map(x=>x.slice());sequence=which==="a"?[["ta","titi","rest","ta"],["ta","rest","titi","ta"]]:[["rest","ta","titi","ta"],["titi","ta","ta","rest"]];await perform("mine");const duration=8*60000/bpm+350;clock.push(setTimeout(()=>{sequence=save;draw()},duration))}
$("audioStart").onclick=prepare;$("teacherToggle").onclick=()=>{$("teacher").classList.toggle("hidden")};$("fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$("prev").onclick=()=>{stop();stage=Math.max(0,stage-1);draw()};$("next").onclick=()=>{stop();stage=Math.min(9,stage+1);draw()};$("nav").onclick=e=>{const b=e.target.closest("[data-stage]");if(b){stop();stage=+b.dataset.stage;draw()}};$("body").onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.pad){await audition(b.dataset.pad)}else if(b.dataset.play){await perform(b.dataset.play)}else if(b.dataset.stop){stop()}else if(b.dataset.metronome){await metronome()}else if(b.dataset.example){await example(b.dataset.example)}else if(b.dataset.edit){const [m,i]=b.dataset.edit.split("-").map(Number);sequence[m][i]={ta:"titi",titi:"rest",rest:"ta"}[sequence[m][i]];draw()}else if(b.dataset.random){const v=["ta","titi","rest"];sequence=Array.from({length:2},()=>Array.from({length:4},()=>v[Math.floor(Math.random()*3)]));if(!sequence.flat().includes("rest"))sequence[0][2]="rest";draw()}else if(b.dataset.reset){sequence=[["ta","titi","rest","ta"],["ta","rest","titi","ta"]];draw()}else if(b.dataset.print){window.print()}else if(b.dataset.answer){const [i,j]=b.dataset.answer.split("-").map(Number);answers[i]=j;draw()}};$("body").oninput=e=>{if(e.target.id==="bpm"){bpm=+e.target.value;$("bpmValue").textContent=bpm}else if(e.target.id==="vol"){volume=+e.target.value/100;$("volValue").textContent=e.target.value+"%"}};document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()});draw();
</script></body></html>
