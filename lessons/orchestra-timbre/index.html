<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>오케스트라 악기의 음색 · 교실 직접 체험</title><style>
*{box-sizing:border-box}body{margin:0;background:#101725;color:#f2f6ff;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#172238;padding:17px max(20px,calc((100% - 1200px)/2));display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-bottom:1px solid #3e4d62}header b{font-size:20px}header small{color:#b5cedb}button{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;background:#a1e3d8;color:#142638}button:hover{filter:brightness(1.1)}button.alt{color:#eef5ff;background:#2b3b53;border:1px solid #486174}.layout{max-width:1230px;margin:20px auto;padding:0 18px;display:grid;grid-template-columns:204px 1fr;gap:22px}nav{background:#1b273a;border:1px solid #384b66;border-radius:16px;padding:12px;align-self:start;position:sticky;top:20px}nav button{display:block;text-align:left;width:100%;background:transparent;color:#b6cad7;margin:3px 0}nav button.sel{color:#a5ffe2;background:#2d514c}main{padding:27px;background:#19263a;border:1px solid #3d5068;border-radius:16px;min-height:650px}h1{font-size:clamp(28px,4vw,42px);margin:12px 0}p{color:#c4d3e3;line-height:1.65}.topline{font-size:12px;color:#a3e5d7;letter-spacing:1px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:22px}.card{background:#243249;border:1px solid #485b72;border-radius:14px;overflow:hidden}.card img{height:150px;width:100%;object-fit:contain;background:#111927}.card .inside{padding:14px}.card h3{margin:5px 0 3px}.card p{font-size:13px;min-height:37px;margin:6px 0}.card button{width:100%;font-size:13px;margin:5px 0}.card audio{width:100%;margin:8px 0}.chip{display:inline-block;color:#c6ddd9;background:#38545b;font-size:12px;padding:3px 9px;border-radius:20px}.section{padding:16px;border-radius:13px;background:#22344b;margin:20px 0;border:1px solid #3a5973}.audio{border:1px solid #496179;background:#1b2c41;border-radius:12px;padding:13px;margin:9px 0}.audio audio{display:block;width:100%;margin-top:7px}.audio .err{display:none;color:#ffce96;font-size:12px}.frame{aspect-ratio:16/9;width:100%;max-width:850px;background:black;border-radius:13px;overflow:hidden;margin-top:12px}.frame iframe{width:100%;height:100%;border:0}.frameInfo{font-size:12px;color:#f6cd8e}.qbtn{display:block;width:100%;text-align:left;margin:7px 0;color:white;background:#314761;border:1px solid #546e88}.correct{background:#235940!important}.wrong{background:#773b48!important}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;border-top:1px solid #53657e;padding-top:18px}.note{color:#d9dda5;font-size:13px}.muted{color:#a8bacf;font-size:12px}#videobox{display:none;margin-top:24px;padding:15px;background:#0e1829;border:1px solid #587069;border-radius:14px}#videobox h3{margin:0}.questions{margin-top:16px}.ask{font-weight:800;font-size:19px}.bar{height:5px;background:#2b3b52}.bar span{display:block;height:100%;background:#81d8bb;transition:width .2s}footer{max-width:1200px;padding:20px;margin:auto;font-size:12px;color:#b5c5d9}footer a{color:#9adacb}.ins{display:flex;gap:8px;flex-wrap:wrap}.mediaMessage{color:#ffc98c;font-size:12px}.family{padding:10px 15px;border:1px solid #55705f;color:#abedc4;border-radius:10px}#status{font-size:12px;color:#b9eece}@media(max-width:780px){.layout{grid-template-columns:1fr}nav{position:static;display:flex;overflow:auto;gap:5px}nav button{min-width:120px}main{padding:18px}.foot{flex-wrap:wrap}}
</style></head><body><header><div><b>🎼 오케스트라 소리 탐험대</b><br><small>중학교 2학년 · 실제 악기 사진과 연주 · 45분</small></div><div><button class="alt" onclick="document.documentElement.requestFullscreen()">전체화면</button> <span id="status">화면 안에서 듣고 보기</span></div></header><div class="bar"><span id="progress"></span></div><div class="layout"><nav id="nav"></nav><main><div id="lesson"></div><section id="videobox"><h3 id="videoTitle"></h3><div class="frame" id="videoFrame"></div><p class="frameInfo">수업 화면에서 영상을 재생합니다. 게시자가 임베딩을 제한하면 재생되지 않을 수 있습니다.</p><button class="alt" onclick="stopVideo()">영상 닫기</button></section><div class="foot"><button class="alt" onclick="gotoScene(scene-1)">← 이전 장면</button><span id="counter" class="muted"></span><button onclick="gotoScene(scene+1)">다음 장면 →</button></div></main></div><footer>음악과 감상 수업용 비상업적 교실 자료. 악기 이미지 및 소개: <a href="https://philharmonia.co.uk/resources/instruments/">Philharmonia Orchestra</a>. 녹음: <a href="https://commons.wikimedia.org/">Wikimedia Commons</a> (개별 저작자 및 이용조건 참조). 영상: 각 공식 유튜브 채널의 임베드 플레이어. 학생정보·성적은 서버로 전송하지 않습니다.</footer>
<script>
const I=[{"id":"violin","name":"바이올린","family":"현악기","desc":"활로 켜는 섬세하고 유연한 소리","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/17134958/01_violin_flat-960x600.jpg","yt":"zgaQFLUdUL0","sound":0},{"id":"viola","name":"비올라","family":"현악기","desc":"바이올린보다 낮고 부드러운 중음역","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/09/18_viola-1-960x600.jpg","yt":"XierDLeUiYg","sound":-1},{"id":"cello","name":"첼로","family":"현악기","desc":"깊고 따뜻한 중저음역","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/17170946/19_cello-960x600.jpg","yt":"","sound":-1},{"id":"bass","name":"더블베이스","family":"현악기","desc":"무게감 있는 저음","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/02/03094744/20_bass-960x600.jpg","yt":"nUUVSxZ4ohI","sound":-1},{"id":"flute","name":"플루트","family":"목관악기","desc":"공기 흐름이 만드는 맑은 음색","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/17171844/03_flute_flat-960x600.jpg","yt":"MTqOckjkkeE","sound":2},{"id":"oboe","name":"오보에","family":"목관악기","desc":"겹리드가 만드는 선명한 소리","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/17172005/04_oboe_flat-960x600.jpg","yt":"QNBsgfh4UMY","sound":-1},{"id":"clarinet","name":"클라리넷","family":"목관악기","desc":"홑리드의 부드럽고 다양한 음색","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/17172135/06_clarinet_flat-960x600.jpg","yt":"nENXs6n_ITI","sound":-1},{"id":"bassoon","name":"바순","family":"목관악기","desc":"깊고 독특한 저음","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/20092901/09_bassoon_flat-960x600.jpg","yt":"-kmy-hm3ai4","sound":5},{"id":"horn","name":"호른","family":"금관악기","desc":"둥글고 풍부한 울림","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/02/03094716/11_horn_flat-960x600.jpg","yt":"cK0UFgnrIqY","sound":-1},{"id":"trumpet","name":"트럼펫","family":"금관악기","desc":"맑고 강렬하게 뻗는 소리","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/02/05100602/12_trumpet_1-960x600.jpg","yt":"QcIp7K2UFgE","sound":-1},{"id":"trombone","name":"트롬본","family":"금관악기","desc":"슬라이드로 음높이를 조절","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/28093158/trombones-thumbnail-960x600.jpg","yt":"EndhDQWlUgg","sound":-1},{"id":"tuba","name":"튜바","family":"금관악기","desc":"묵직한 저음을 담당","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/02/03094736/15_tuba-960x600.jpg","yt":"PzH4XAv9ZCQ","sound":-1},{"id":"timpani","name":"팀파니","family":"타악기","desc":"음높이를 조절할 수 있는 북","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/02/03094751/29_timpani-960x600.jpg","yt":"40k3AAbA7tM","sound":-1},{"id":"snare","name":"스네어드럼","family":"타악기","desc":"울림줄이 만드는 선명한 타격음","img":"https://philharmonia-assets.s3.eu-west-1.amazonaws.com/uploads/2020/01/29170650/26_snare_tenor-16x10.jpg","yt":"-lJctvybAJ8","sound":-1}],S=[["바이올린 개방현","https://upload.wikimedia.org/wikipedia/commons/7/73/Violin_open_string.ogg","Clngre, CC BY-SA 3.0"],["바이올린 피치카토","https://upload.wikimedia.org/wikipedia/commons/c/cd/Violin_pizzicato.ogg","Clngre, CC BY-SA 3.0"],["플루트 실제 연주","https://upload.wikimedia.org/wikipedia/commons/0/05/Flute.ogg","hokuspokus, Public Domain"],["첼로 개방현","https://commons.wikimedia.org/wiki/Special:FilePath/Cello_strings.ogg","Wikimedia Commons"],["클라리넷 실제 연주","https://commons.wikimedia.org/wiki/Special:FilePath/Jazz_Clarinet.ogg","Wikimedia Commons"],["바순 반음계","https://commons.wikimedia.org/wiki/Special:FilePath/Bassoon-technical-chromatic.ogg","Kat Walsh, Wikimedia Commons"]],Q=[["공기를 입술로 불어 날숨을 가로질러 소리 내는 목관악기는?",["플루트","오보에","트롬본","첼로"],0,"플루트는 공기 흐름을 모서리에 부딪쳐 소리를 냅니다."],["바이올린의 현을 손가락으로 뜯는 주법은?",["레가토","피치카토","스타카토","글리산도"],1,"피치카토(pizzicato)는 현을 손가락으로 뜯어 연주하는 주법입니다."],["겹리드를 사용하는 목관악기는?",["클라리넷","플루트","오보에","트럼펫"],2,"오보에와 바순은 겹리드를 사용합니다."],["금관악기 소리의 직접적인 진동원은?",["활","연주자의 입술","현","북면"],1,"연주자의 입술 진동이 마우스피스와 관을 통해 소리로 확장됩니다."],["음높이를 조절하여 연주하는 대표적인 오케스트라 북은?",["스네어드럼","심벌즈","팀파니","베이스드럼"],2,"팀파니는 조율 가능한 타악기입니다."],["가장 낮은 음역을 담당하는 현악기는?",["비올라","바이올린","첼로","더블베이스"],3,"더블베이스는 현악기군의 저음역을 담당합니다."],["음색을 비교할 때 반드시 고려해야 하는 것은?",["음높이와 연주법","악기의 색상","연주자 국적","악기 가격"],0,"높낮이·세기·주법·음역도 함께 확인해야 음색을 공정하게 비교할 수 있습니다."],["금속으로 제작된 현대 플루트가 목관악기에 속하는 이유는?",["나무처럼 보이기 때문","나무로만 만들 수 있어서","금속이 얇아서","발음 원리와 전통적인 악기 분류 때문"],3,"재료만으로 구분하지 않고 발음 원리와 역사적 분류를 함께 봅니다."]];
const steps=[['도입',4],['소리 듣기',5],['현악기',7],['목관악기',7],['금관악기',7],['타악기',4],['음색 퀴즈',7],['상황별 편성',3],['정리',1]];
let scene=0,qindex=0,answers={},selected=[];
const $=x=>document.getElementById(x);
function enc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stopVideo(){$('videoFrame').innerHTML='';$('videobox').style.display='none'}
function openVideo(name,id,start=0){if(!id)return;$('videobox').style.display='block';$('videoTitle').textContent=name;$('videoFrame').innerHTML='<iframe referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen title="'+enc(name)+'" src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?rel=0&playsinline=1&start='+start+'"></iframe>';$('videobox').scrollIntoView({block:'center',behavior:'smooth'})}
function audiobox(s){return '<div class="audio"><b>🔉 '+enc(s[0])+'</b><audio controls preload="none" src="'+s[1]+'" onerror="this.nextElementSibling.style.display=\'block\'"></audio><span class="err">이 음원을 불러오지 못했습니다. 학교망에서 Wikimedia 접속 제한 여부를 확인하세요.</span><div class="muted">실제 악기 녹음 · '+enc(s[2])+'</div></div>'}
function card(i){const a=I[i];let clip=a.sound>=0&&S[a.sound]?audiobox(S[a.sound]):'';return '<div class="card"><img loading="lazy" src="'+a.img+'" alt="'+enc(a.name)+' 실제 악기 사진" onerror="this.style.opacity=.2;this.alt=\'사진 로딩 실패\'"><div class="inside"><span class="chip">'+enc(a.family)+'</span><h3>'+enc(a.name)+'</h3><p>'+enc(a.desc)+'</p>'+clip+(a.yt?'<button onclick="openVideo(I['+i+'].name,I['+i+'].yt)">▶ 연주 영상 이 화면에서 재생</button>':'')+'</div></div>'}
function timeTitle(s,title,desc){return '<div class="topline">'+enc(steps[s][0])+' · '+steps[s][1]+'분</div><h1>'+enc(title)+'</h1><p>'+enc(desc)+'</p>'}
function familyPage(name,desc){return timeTitle(scene,name,desc)+'<div class="cards">'+I.map((a,i)=>a.family===name?card(i):'').join('')+'</div>'}
function quizPage(){let q=Q[qindex];return timeTitle(scene,'귀로 듣고, 눈으로 구별하기','8문항 형성평가 · 정답은 그 자리에서 확인됩니다.')+'<div class="section"><div class="muted">문항 '+(qindex+1)+'/8</div><p class="ask">'+enc(q[0])+'</p><div class="questions">'+q[1].map((v,j)=>'<button class="qbtn '+(answers[qindex]!==undefined?(j===q[2]?'correct':j===answers[qindex]?'wrong':''):'')+'" onclick="choose('+j+')">'+(j+1)+'. '+enc(v)+'</button>').join('')+'</div>'+(answers[qindex]!==undefined?'<div class="note">'+(answers[qindex]===q[2]?'✓ 정답':'✕ 다시 확인')+' · '+enc(q[3])+'</div>':'')+'</div><div class="ins"><button class="alt" onclick="qindex=Math.max(0,qindex-1);draw()">이전 문항</button><button onclick="qindex=Math.min(7,qindex+1);draw()">다음 문항</button></div><p class="muted">실제 연주 녹음을 다시 듣고 싶다면 이전 악기군 장면으로 이동하세요.</p>'}
function choose(j){answers[qindex]=j;draw()}
function draw(){stopVideo();$('nav').innerHTML=steps.map((s,i)=>'<button class="'+(i===scene?'sel':'')+'" onclick="gotoScene('+i+')">'+(i+1)+'. '+s[0]+' <small>'+s[1]+'분</small></button>').join('');$('counter').textContent=(scene+1)+' / 9 장면';$('progress').style.width=((scene+1)*100/9)+'%';let h='';
switch(scene){
case 0:h=timeTitle(scene,'오케스트라는 왜 이렇게 악기가 많을까?','실제 연주 영상에서 음색이 언제 어떻게 바뀌는지 찾아봅시다.')+'<div class="section"><h2>생각 열기</h2><p>화면을 보지 않고 20초 듣기 → 어떤 악기군이 들렸는지 추측 → 화면으로 확인</p><button onclick="openVideo(\'브리튼 청소년을 위한 관현악 입문\',\'-hFFIrKZdSY\',229)">▶ 공연 영상을 수업 화면에서 재생</button></div>';break;
case 1:h=timeTitle(scene,'실제 소리만 듣고 맞혀보자','이 소리의 악기 이름과 그렇게 추측한 이유를 말해 보세요.')+S.filter((s,i)=>[0,2,3,5].includes(i)).map(audiobox).join('')+'<p>음색뿐 아니라 음높이와 연주법의 차이도 함께 관찰합니다.</p>';break;
case 2:h=familyPage('현악기','현의 진동으로 소리를 내고, 활을 쓰거나 뜯는 방법으로 음색을 바꿉니다.');break;
case 3:h=familyPage('목관악기','플루트의 공기 흐름, 홑리드, 겹리드의 차이를 듣고 관찰합니다.');break;
case 4:h=familyPage('금관악기','연주자의 입술 진동으로 시작되는 다양한 금관 음색을 비교합니다.');break;
case 5:h=familyPage('타악기','팀파니의 조율된 음높이와 스네어드럼의 복잡한 타격음을 비교합니다.');break;
case 6:h=quizPage();break;
case 7:h=timeTitle(scene,'영화 장면의 오케스트라 감독','새벽 안개 속 숲을 걷는 장면이라면 어떤 악기군으로 시작할까요?')+'<div class="section"><p>음색과 연주법을 근거로 악기군을 선택해 보세요.</p>'+['현악기','목관악기','금관악기','타악기'].map(f=>'<button class="alt" style="margin:5px" onclick="toggleFamily(\''+f+'\')">'+f+(selected.includes(f)?' ✓':'')+'</button>').join('')+'<p class="family">선택: '+(selected.join(' + ')||'없음')+'</p><p>나는 _____을/를 골랐다. 그 이유는 _____이다.</p></div>';break;
case 8:let cnt=Object.values(answers).filter((x,i)=>x===Q[Number(Object.keys(answers)[i])][2]).length;h=timeTitle(scene,'오늘의 한 문장','음색을 근거로 악기를 구별하고 설명해 봅시다.')+'<div class="section"><h2>배운 것 정리</h2><p>_____와 _____의 소리는 _____에서 차이가 난다.</p><p>퀴즈 응답: '+Object.keys(answers).length+'/8 · 맞힌 문항: '+Object.keys(answers).filter(k=>answers[k]===Q[k][2]).length+'/8</p></div>';break;
}
$('lesson').innerHTML=h;}
function toggleFamily(f){selected=selected.includes(f)?selected.filter(x=>x!==f):selected.concat([f]);draw()}
function gotoScene(n){if(n<0||n>=steps.length)return;document.querySelectorAll('audio').forEach(x=>x.pause());scene=n;draw();window.scrollTo({top:0,behavior:'smooth'})}
draw();
</script></body></html>
