<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가야금 소리의 결 · 45분</title><style>*{box-sizing:border-box}body{margin:0;background:#f0fbff;color:#173d59;font:18px/1.55 system-ui,'Malgun Gothic',sans-serif}header{background:white;border-bottom:5px solid #27bca8;padding:20px 5%}h1{font-size:clamp(30px,4vw,48px)}.wrap{max-width:1200px;margin:20px auto;padding:0 18px;display:grid;grid-template-columns:235px 1fr;gap:18px}nav,main{background:white;border:1px solid #c3dfeb;border-radius:22px;padding:20px}nav button{display:block;width:100%;margin:5px 0;text-align:left}button{background:#e9f6ff;color:#13517b;border:1px solid #b3d4e5;border-radius:12px;padding:11px;font:inherit;cursor:pointer}button.sel{background:#155c9b;color:white}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.actions button{flex:1}.card{background:#effbf8;border:1px solid #bfe6da;border-radius:16px;padding:18px;margin:15px 0}.guide{background:#fff6e8;border:1px solid #efd7b5;border-radius:16px;padding:18px;margin:15px 0}.hidden{display:none}.video{width:100%;max-height:340px;background:#122e40;border-radius:14px}textarea{width:100%;min-height:100px;padding:12px;font:inherit;border:1px solid #b3d4e5;border-radius:10px}footer{display:flex;justify-content:space-between;align-items:center}#clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow:auto}nav button{min-width:150px}}button:focus-visible,textarea:focus-visible{outline:3px solid #1bb2bd}</style></head><body><header><p>2022 개정 음악과 · 중2 · 감상 · 45분</p><h1>🎶 가야금 소리의 결</h1><p>실제 사람의 연주를 듣고 음색·여운·시김새를 근거로 설명하기</p><div class="actions"><a href="worksheet.html" target="_blank" rel="noopener" style="display:inline-block;padding:11px 15px;background:#e9f6ff;border:1px solid #b3d4e5;border-radius:12px;color:#13517b;font-weight:700;text-decoration:none">📝 학생 활동지 인쇄</a><button id="full">전체화면</button><button id="guideBtn">교사 해설 보기</button><b id="clock">04:00</b><button id="timerBtn">▶ 타이머</button><button id="reset">초기화</button></div></header><div class="wrap"><nav id="nav"></nav><main><p id="label"></p><h2 id="heading"></h2><p id="task"></p><section class="card"><h3>실제 가야금 실연 (45초)</h3><video class="video" controls preload="none" playsinline><source src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Traditional_gayageum_play.ogg" type="video/ogg">OGG 영상을 지원하지 않는 브라우저입니다.</video><p><a href="https://commons.wikimedia.org/wiki/File:Traditional_gayageum_play.ogg" target="_blank" rel="noopener">재생되지 않으면 Wikimedia 원본 페이지 열기</a></p><small>출처: Xia, CC BY-SA 4.0, Wikimedia Commons. 실제 사람이 연주한 영상이며 합성 음원이 아닙니다. 인터넷 필요, 교실 브라우저 재생 미검증.</small></section><section id="activity" class="card"></section><section id="guide" class="guide hidden"></section><footer><button id="prev">이전</button><b id="count"></b><button id="next">다음</button></footer></main></div><script>
const S=[["첫 소리와 느낌",4,"45초 실제 가야금 실연을 듣고 소리의 질감을 두 단어로 적으세요.","소리가 맑다고 느꼈다면 어떤 소리가 근거인가요?","줄을 뜯는 소리가 또렷하고 울림이 남아요."],["줄과 손 관찰",5,"줄을 뜯는 손과 누르는 손의 움직임을 관찰하세요.","두 손은 어떤 역할을 하나요?","뜯어서 소리를 내고 눌러서 표현을 바꿔요."],["음색과 여운",5,"소리 시작과 사라지는 여운을 비교하세요.","소리가 끝난 뒤 무엇이 남나요?","줄의 울림이 이어져요."],["시김새 관찰",5,"손으로 줄을 눌렀을 때 음높이 움직임을 관찰하세요.","같은 줄의 음이 움직이는 것처럼 들리나요?","누르는 움직임에 따라 소리가 달라져요."],["근거 중심 감상",5,"느낌 단어 하나를 고르고 들은 소리로 설명하세요.","차분하다는 느낌을 어떤 소리로 뒷받침하나요?","울림이 이어져 차분하게 느껴져요."],["양손 역할 시연",5,"악기 없이 뜯기와 누르기 동작을 구분해 시연하세요.","실제 가야금의 양손 역할은 어떻게 다른가요?","한 손은 뜯고 다른 손은 누릅니다."],["전반과 후반 비교",5,"연주의 앞부분과 뒷부분을 듣고 음의 간격을 비교하세요.","어느 부분의 음이 더 촘촘하게 들리나요?","부분에 따라 음이 이어지는 간격이 달라요."],["음악 활용 상황",4,"전시회나 이야기 장면을 선택하고 이 음악의 적합성을 설명하세요.","선택한 상황과 소리의 특징이 어떻게 연결되나요?","여운이 길어 조용한 장면과 어울려요."],["개별 확인 퀴즈",5,"관찰과 개념에 관한 네 문항에 답하세요.","어떤 근거로 선택했나요?","실연 영상에서 줄을 뜯는 장면을 확인했어요."],["종료 티켓",2,"소리 특징 하나와 그 근거를 한 문장으로 적으세요.","오늘 배운 음색을 어떻게 설명하겠나요?","뜯은 뒤 울림이 이어지는 것이 특징이에요."]],Q=[["실연에서 직접 확인되는 동작은?",["건반 누르기","줄 뜯기","활로 긋기"],1,"가야금은 줄을 뜯어 소리를 낼 수 있습니다."],["여운은 무엇인가요?",["소리가 난 뒤 남는 울림","연주 시작 전 침묵","악기의 크기"],0,"여운은 소리가 난 뒤 이어지는 울림입니다."],["가장 좋은 감상 근거는?",["그냥 좋아요","모든 국악은 같아요","줄을 뜯은 뒤 울림이 남아요"],2,"관찰한 소리를 근거로 제시했습니다."],["줄을 누르는 손을 관찰할 이유는?",["소리 표현과 음높이 변화를 보기 위해","박자만 세기 위해","악기 종류를 바꾸기 위해"],0,"줄을 눌러 음높이와 표현을 바꾸는 연주를 관찰합니다."]];let step=0,elapsed=0,timer=null,guide=false,notes={},answers={};const $=x=>document.getElementById(x),escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showClock(){let v=Math.max(0,S[step][1]*60-elapsed);$('clock').textContent=String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');$('timerBtn').textContent=timer?'Ⅱ 일시정지':'▶ 타이머';$('timerBtn').disabled=v===0}function pause(){if(timer){clearInterval(timer);timer=null}showClock()}function reset(){pause();elapsed=0;showClock()}function move(n){pause();step=Math.max(0,Math.min(9,n));reset();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let s=S[step];$('nav').innerHTML=S.map((v,i)=>'<button data-step="'+i+'" class="'+(step===i?'sel':'')+'">'+(i+1)+'. '+escapeHTML(v[0])+' · '+v[1]+'분</button>').join('');$('label').textContent='장면 '+(step+1)+' / 10 · '+s[1]+'분';$('heading').textContent=s[0];$('task').textContent=s[2];$('count').textContent=(step+1)+'/10';$('prev').disabled=step===0;$('next').disabled=step===9;$('guide').classList.toggle('hidden',!guide);$('guide').innerHTML='<h3>교사 발문</h3><p>'+escapeHTML(s[3])+'</p><h3>예상 답변</h3><p>'+escapeHTML(s[4])+'</p>';if(step===8){$('activity').innerHTML='<h3>개별 형성평가</h3>'+Q.map((q,i)=>'<p><b>'+(i+1)+'. '+escapeHTML(q[0])+'</b></p><div class="actions">'+q[1].map((v,j)=>'<button data-q="'+i+'" data-choice="'+j+'" class="'+(answers[i]===j?'sel':'')+'">'+escapeHTML(v)+'</button>').join('')+'</div><p>'+(answers[i]===undefined?'답을 선택하세요.':(answers[i]===q[2]?'✓ 정답. ':'다시 생각하세요. ')+escapeHTML(q[3]))+'</p>').join('')}else{$('activity').innerHTML='<h3>나의 관찰·생각</h3><textarea id="note" placeholder="이름·학번을 쓰지 마세요. 입력 내용은 전송·저장되지 않습니다.">'+escapeHTML(notes[step]||'')+'</textarea><p>소리에서 관찰한 근거를 함께 작성하세요.</p>'}showClock()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined)move(+b.dataset.step);if(b.dataset.q!==undefined){answers[+b.dataset.q]=+b.dataset.choice;render()}});document.addEventListener('input',e=>{if(e.target.id==='note')notes[step]=e.target.value});$('prev').onclick=()=>move(step-1);$('next').onclick=()=>move(step+1);$('timerBtn').onclick=()=>{if(timer){pause();return}timer=setInterval(()=>{elapsed++;if(elapsed>=S[step][1]*60)pause();else showClock()},1000);showClock()};$('reset').onclick=reset;$('guideBtn').onclick=()=>{guide=!guide;$('guideBtn').textContent=guide?'교사 해설 숨기기':'교사 해설 보기';render()};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});render();
</script></body></html>
