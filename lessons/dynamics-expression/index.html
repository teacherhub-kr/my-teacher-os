 solid #20b39d;background:#e1f8ef}.status{font-weight:800;color:#166c72}.muted{font-size:15px;color:#54778b}.hidden{display:none}.mbar{display:flex;gap:10px;align-items:center;margin:10px 0}.mbar label{min-width:70px;font-weight:900}.mbar input{width:100%;accent-color:#22ac9f}.meter{height:14px;background:#d5e8f3;border-radius:10px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#4a9bed,#25c2a8);width:0}.timer{font-size:21px;font-weight:900;color:#0b897e}textarea{width:100%;min-height:110px;font:inherit;border:2px solid #b6d6e7;border-radius:12px;padding:12px;color:#215879}select{font:inherit;padding:9px;border:2px solid #a5d4df;border-radius:10px;background:white;color:#24577d}details{margin:14px 0}.warn{background:#fffaf0;border:1px solid #edcc83;border-radius:12px;padding:13px}@media(max-width:850px){.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto}nav button{min-width:145px}.grid{grid-template-columns:1fr}.main{padding:18px}}@media print{nav,.toolbar,.actions,.footer{display:none!important}}
</style></head><body><header><div class="toolbar"><div style="flex:1"><div class="sub">2022 개정 음악과 · 중학교 2학년 · 45분</div><h1>🎼 셈여림 표현 실험실</h1><div class="sub">같은 선율을 다르게 표현하는 음악가의 선택</div></div><button class="purple" id="guideToggle">🧑‍🏫 교사 설명 보기</button><button id="full">전체화면</button><button id="startAudio" class="primary">🔊 소리 시작</button></div></header><div class="shell"><nav id="nav"></nav><main class="main"><div class="timer">⏱ <span id="clock">00:00</span> <button id="timerBtn">타이머 시작</button><button id="timerReset">초기화</button></div><div class="meter"><span id="progress"></span></div><p class="sub" id="time"></p><h2 id="heading"></h2><p id="lead"></p><div id="content"></div><section id="guide" class="guide hidden"></section><div class="footer"><button id="prev">← 이전 장면</button><b id="count"></b><button class="primary" id="next">다음 장면 →</button></div></main></div><footer style="max-width:1300px;margin:auto;padding:0 20px 24px" class="muted">음원은 기존 오케스트라 수업에 등록된 실제 비올라·바이올린 녹음입니다. 음량만 조절하며 새로운 멜로디를 합성하지 않습니다. 최초 재생에는 인터넷 연결이 필요하고 학생정보는 저장하지 않습니다. <a href="teacher.html">교사용 45분 지도안</a></footer>
<script>
'use strict';
const S=[["도입: 같은 선율, 다른 느낌",4,"같은 선율을 작게·크게 들으면 감정이 달라질까요?","두 연주 중 더 긴장감 있는 것은? 그 이유는?","크게 연주한 두 번째가 더 힘차고 긴장돼요.","음량만으로 감정이 결정된다고 단정하지 않는다.","두 버전의 느낌을 소리 근거로 비교"],["셈여림 기호 탐색",5,"p·mp·mf·f를 듣고 상대적 차이를 비교합니다.","p와 f는 각각 어떤 뜻인가요?","p는 여리게, f는 세게 연주하라는 뜻이에요.","셈여림은 고정 데시벨이 아니라 음악적 맥락에 따른 상대적 표현.","기호와 뜻을 연결"],["현악기 녹음 듣기",5,"실제 현악기 연주 녹음을 듣고 소리의 흐름을 파악합니다.","선율이 반복될 때 셈여림을 바꾸면 무엇이 달라지나요?","같은 음이어도 강조되는 부분이 달라져요.","기존 오케스트라 수업의 실제 현악기 녹음 음원을 활용한다. 녹음을 4등분한 구간과 악보상의 마디를 혼동하지 않는다.","반복되는 선율을 구별"],["점점 세게·여리게",5,"크레셴도와 데크레셴도를 청음으로 구별합니다.","어느 쪽이 점점 세게 연주한 것인가요?","점점 커지는 소리가 크레셴도예요.","크레셴도는 빠르기 증가가 아니라 셈여림 변화.","두 변화의 방향 구별"],["표현 청음 퀴즈",5,"네 가지 음량 패턴을 듣고 p/f/cresc./dim. 구별합니다.","음량이 처음부터 큰가요, 점점 커지나요?","처음부터 크면 f, 점점 커지면 크레셴도예요.","정답 공개 전에 재청음 기회 제공.","4문항 중 구별 근거 확인"],["나만의 4구간 셈여림",8,"연주의 네 구간마다 셈여림을 선택하여 개별 편곡합니다.","왜 세 번째 구간을 크게 표현했나요?","선율의 절정이어서 크게 만들었어요.","음표·리듬은 고정하고 셈여림만 변화시켜 변인을 통제.","4구간 선택과 이유를 제시"],["두 버전 A/B 비교",4,"원본과 자신의 편곡을 연속 듣고 차이를 말합니다.","어느 구간이 더 도드라지나요?","세 번째 구간이 더 두드러져요.","소리가 큰 것과 음악적으로 적절한 것은 동일하지 않다.","차이를 근거와 함께 설명"],["상황에 맞는 표현",4,"위로·축하 상황 중 하나에 맞춰 셈여림을 조정합니다.","위로하는 분위기에 어떤 변화가 어울릴까요?","처음은 여리게, 마지막은 조금 크게요.","감정 표현에는 정답이 하나만 있지 않다.","선택을 음악적 이유로 정당화"],["형성평가",3,"기호·점진적 변화·음악적 이유를 확인합니다.","p와 f의 뜻은? 크레셴도는 무엇인가요?","여리게·세게, 점점 세게예요.","공식 수행평가로 전환하지 않는다.","3문항 즉시 피드백"],["종료 티켓",2,"가장 마음에 드는 구간과 이유를 한 문장으로 씁니다.","어느 구간의 셈여림을 바꾸었고 왜 그랬나요?","3구간을 f로 바꿔 절정을 강조했어요.","학생 이름·학번 입력 금지, 브라우저 저장 금지.","개별 설명 한 문장"]],D=['p','mp','mf','f'],LEVEL=[.16,.29,.47,.72],NOTES=[60,62,64,67,67,64,62,60,60,64,67,72,72,67,64,60];
let step=0,ctx=null,guideOpen=false,seconds=0,timer=null,voice=[],chosen=[1,1,2,3],answers={},ticket='',scenario='위로';
const $=id=>document.getElementById(id);
const htmlEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACOUSTIC_SOURCES={viola:"../orchestra-timbre/assets/viola.ogg",violin:"../orchestra-timbre/assets/violin.ogg"};let selectedRecording="viola",audioBuffers={},audioLoads={};
function audio(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error("이 브라우저는 녹음 음원 재생을 지원하지 않습니다.");ctx=new C()}if(ctx.state==="suspended")ctx.resume();return ctx}
async function recording(){const c=audio();if(audioBuffers[selectedRecording])return audioBuffers[selectedRecording];if(!audioLoads[selectedRecording]){const key=selectedRecording;audioLoads[key]=fetch(ACOUSTIC_SOURCES[key]).then(r=>{if(!r.ok)throw Error("녹음 파일을 불러오지 못했습니다 (HTTP "+r.status+")");return r.arrayBuffer()}).then(data=>c.decodeAudioData(data)).then(b=>{if(!b||b.duration<3)throw Error("녹음 음원 길이가 너무 짧습니다.");audioBuffers[key]=b;return b}).catch(e=>{delete audioLoads[key];throw e})}return audioLoads[selectedRecording]}
let playbackVersion=0;function stop(){playbackVersion++;voice.forEach(x=>{try{x.stop()}catch(e){}});voice=[]}
async function play(pattern){stop();const version=playbackVersion;const status=$("audioStatus");if(status)status.textContent="실제 현악기 녹음 음원을 불러오는 중입니다…";try{
const c=audio(),track=selectedRecording,b=await recording();if(track!==selectedRecording||version!==playbackVersion)return;await c.resume();const levelMap={p:.18,mp:.33,mf:.55,f:.83};
const levels=pattern==="soft"?Array(4).fill(levelMap.p):pattern==="loud"?Array(4).fill(levelMap.f):pattern==="cres"?[.16,.34,.55,.83]:pattern==="dim"?[.83,.55,.34,.16]:pattern==="flat"?Array(4).fill(.46):pattern==="quiz1"?Array(4).fill(.83):pattern==="quiz2"?[.16,.34,.55,.83]:pattern==="quiz3"?[.83,.55,.34,.16]:pattern==="quiz4"?Array(4).fill(.18):levelMap[pattern]!==undefined?Array(4).fill(levelMap[pattern]):chosen.map(i=>[.18,.33,.55,.83][i]);
const source=c.createBufferSource(),gain=c.createGain();source.buffer=b;source.connect(gain).connect(c.destination);
const at=c.currentTime+.08,span=b.duration/4,fade=Math.min(.16,span/5);gain.gain.setValueAtTime(levels[0],at);
for(let i=1;i<4;i++){const t=at+i*span;gain.gain.setValueAtTime(levels[i-1],t-fade);gain.gain.linearRampToValueAtTime(levels[i],t+fade)}
source.start(at);source.stop(at+b.duration);voice.push(source);source.onended=()=>{voice=voice.filter(x=>x!==source)};
if(status)status.textContent="🎻 실제 "+(track==="viola"?"비올라":"바이올린")+" 연주 녹음 · "+Math.round(b.duration)+"초 · 네 구간의 셈여림만 조절해 비교합니다.";
}catch(e){if(status)status.textContent="⚠ 녹음 음원 재생 실패: "+e.message+" · 학교망과 스피커를 확인하세요.";console.warn("Recorded audio load failed",e)}
}
function selectGrid(){return '<div class="grid">'+chosen.map((v,i)=>'<div class="tile"><b>'+(i+1)+'구간</b><p>실제 연주 녹음 구간</p><select data-bar="'+i+'">'+D.map((d,j)=>'<option value="'+j+'" '+(v===j?'selected':'')+'>'+d+' · '+['여리게','조금 여리게','조금 세게','세게'][j]+'</option>').join('')+'</select></div>').join('')+'</div>'}
const quizzes=[['p의 뜻은?',['세게','여리게','점점 빠르게'],1,'p는 piano의 약자로 여리게입니다.'],['f의 뜻은?',['세게','여리게','점점 느리게'],0,'f는 forte의 약자로 세게입니다.'],['크레셴도는?',['점점 세게','점점 여리게','점점 빠르게'],0,'점점 세게 연주하는 셈여림 변화입니다.'],['같은 선율을 다르게 느끼게 할 수 있는 것은?',['셈여림 선택','음표 이름만 바꾸기','박을 없애기'],0,'셈여림을 달리하면 음악적 강조와 분위기가 달라질 수 있습니다.']];
function playButtons(arr){return '<div class="actions"><button type="button" data-recording="viola" class="choice '+(selectedRecording==="viola"?"chosen":"")+'">🎻 비올라 실제 연주</button><button type="button" data-recording="violin" class="choice '+(selectedRecording==="violin"?"chosen":"")+'">🎻 바이올린 실제 연주</button></div><div class="actions">'+arr.map(x=>'<button class="primary" data-play="'+x[0]+'">▶ '+x[1]+'</button>').join('')+'</div><div class="status" id="audioStatus">기존 오케스트라 수업의 실제 연주 녹음을 재생합니다.</div>'}
function renderContent(){switch(step){
case 0:return '<div class="panel"><h3>소리 먼저 듣기</h3><p>두 연주의 음과 리듬은 같습니다. 다른 점을 찾아보세요.</p>'+playButtons([['soft','A · 여리게'],['loud','B · 세게']])+'<p>두 연주의 차이를 한 문장으로 말해 봅시다.</p></div>';
case 1:return '<div class="panel"><h3>셈여림 기호 카드</h3><div class="grid">'+D.map((d,i)=>'<button data-dyn="'+i+'" class="tile"><b style="font-size:40px">'+d+'</b><p>'+['여리게','조금 여리게','조금 세게','세게'][i]+'</p><small>눌러서 소리 듣기</small></button>').join('')+'</div><div id="audioStatus" class="status">기호를 선택해 들어 보세요.</div></div>';
case 2:return '<div class="panel"><h3>실제 연주 녹음 · 원본</h3><p>기존 「오케스트라의 소리」에 사용된 실제 바이올린·비올라 연주 녹음을 듣습니다.</p>'+playButtons([['flat','일정한 셈여림으로 듣기']])+'<p>같은 녹음을 4개 시간 구간으로 나누어 들어 봅니다. 실제 악보의 4마디라는 뜻은 아닙니다.</p></div>';
case 3:return '<div class="panel"><h3>점점 세게 / 점점 여리게</h3><div class="grid"><div class="tile"><b>cresc. &lt;</b><p>크레셴도 · 점점 세게</p></div><div class="tile"><b>dim. &gt;</b><p>데크레셴도 · 점점 여리게</p></div></div>'+playButtons([['cres','점점 세게'],['dim','점점 여리게']])+'</div>';
case 4:return '<div class="panel"><h3>귀로 맞히는 4가지 표현</h3><p id="audioStatus" class="status" role="status">청음 버튼을 눌러 먼저 들어 보세요.</p>'+['quiz1','quiz2','quiz3','quiz4'].map((x,i)=>'<div class="tile" style="margin:12px 0"><b>'+(i+1)+'번 소리</b><div class="actions"><button class="primary" data-play="'+x+'">▶ 듣기</button></div><div class="grid">'+['처음부터 세게','점점 세게','점점 여리게','처음부터 여리게'].map((label,j)=>'<button class="choice '+(answers['ear'+i]===j?'chosen':'')+'" data-ear="'+i+'" data-choice="'+j+'">'+label+'</button>').join('')+'</div><p class="status">'+(answers['ear'+i]===undefined?'듣고 답을 선택하세요.':(answers['ear'+i]===[0,1,2,3][i]?'✓ 정답':'다시 들어 보세요'))+'</p></div>').join('')+'</div>';
case 5:return '<div class="panel"><h3>내가 만드는 4구간 셈여림</h3><p>각 시간 구간의 셈여림을 선택하세요. 실제 연주 음원은 그대로 두고 셈여림만 조정합니다.</p>'+selectGrid()+playButtons([['flat','원본'],['mine','내 편곡']])+'<p>세 번째 구간을 강조할 수도, 마지막을 여리게 마무리할 수도 있습니다.</p></div>';
case 6:return '<div class="panel"><h3>원본과 편곡 비교</h3>'+selectGrid()+playButtons([['flat','원본 듣기'],['mine','내 편곡 듣기']])+'<p>어느 구간이 가장 달라졌나요? 그 이유를 설명하세요.</p></div>';
case 7:return '<div class="panel"><h3>상황에 맞는 음악</h3><div class="actions"><button data-scenario="위로">위로하는 장면</button><button data-scenario="축하">축하하는 장면</button></div><p>선택한 상황: <b>'+scenario+'</b></p>'+selectGrid()+playButtons([['mine','내 표현 듣기']])+'<p>상황과 셈여림 선택을 연결하여 한 문장으로 설명해 봅시다.</p></div>';
case 8:return '<div class="panel"><h3>개별 형성평가 · 즉시 피드백</h3>'+quizzes.map((q,i)=>'<div class="tile" style="margin:12px 0"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((x,j)=>'<button class="choice '+(answers['q'+i]===j?'chosen':'')+'" data-q="'+i+'" data-answer="'+j+'">'+x+'</button>').join('')+'<p class="status">'+(answers['q'+i]===undefined?'답을 선택하세요.':(answers['q'+i]===q[2]?'✓ 정답 · ':'다시 생각해 보세요 · ')+q[3])+'</p></div>').join('')+'</div>';
case 9:return '<div class="panel"><h3>1분 종료 티켓</h3><p>“나는 ___구간을 ___로 표현했다. 그 이유는 ___이다.”</p><textarea id="ticket" placeholder="이름·학번을 입력하지 마세요. 이 내용은 서버에 저장되지 않습니다.">'+htmlEscape(ticket)+'</textarea><p class="muted">입력 내용은 이 페이지를 닫으면 사라집니다.</p></div>';

function render(){const s=S[step];$('nav').innerHTML=S.map((x,i)=>'<button class="'+(i===step?'sel':'')+'" data-step="'+i+'">'+(i+1)+'. '+x[0]+' <small>'+x[1]+'분</small></button>').join('');$('time').textContent='장면 '+(step+1)+' · '+s[1]+'분';$('heading').textContent=s[0];$('lead').textContent=s[2];$('content').innerHTML=renderContent();$('guide').classList.toggle('hidden',!guideOpen);$('guide').innerHTML='<h3>📝 교사용 설명</h3><p>'+s[2]+'</p><div class="grid"><div class="tile"><b>교사 발문</b><p>'+s[3]+'</p></div><div class="tile"><b>예상 답변</b><p>'+s[4]+'</p></div></div><div class="warn"><b>지도 유의사항</b><p>'+s[5]+'</p></div><p><b>성취 확인:</b> '+s[6]+'</p>';$('progress').style.width=(step+1)*10+'%';$('count').textContent=(step+1)+' / 10 장면';$('prev').disabled=step===0;$('next').disabled=step===9}
function move(n){stop();step=Math.max(0,Math.min(9,n));render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.step!==undefined)return move(+el.dataset.step);if(el.dataset.recording){stop();selectedRecording=el.dataset.recording;return render()}if(el.dataset.play)return play(el.dataset.play);if(el.dataset.dyn!==undefined)return play(['p','mp','mf','f'][+el.dataset.dyn]);if(el.dataset.ear!==undefined){answers['ear'+el.dataset.ear]=+el.dataset.choice;return render()}if(el.dataset.q!==undefined){answers['q'+el.dataset.q]=+el.dataset.answer;return render()}if(el.dataset.scenario){scenario=el.dataset.scenario;return render()}});
document.addEventListener('change',e=>{if(e.target.dataset.bar!==undefined){chosen[+e.target.dataset.bar]=+e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='ticket')ticket=e.target.value});
$('prev').onclick=()=>move(step-1);$('next').onclick=()=>move(step+1);$('guideToggle').onclick=()=>{guideOpen=!guideOpen;$('guideToggle').textContent=guideOpen?'🧑‍🏫 교사 설명 숨기기':'🧑‍🏫 교사 설명 보기';render()};$('startAudio').onclick=async()=>{$('startAudio').textContent='🎻 실제 연주 녹음 로딩 중…';try{await recording();$('startAudio').textContent='✓ 실제 연주 녹음 준비 완료'}catch(e){$('startAudio').textContent='⚠ 음원 재생 실패 · 다시 시도';console.warn('Recorded audio load failed',e)}};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('timerBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('timerBtn').textContent='타이머 시작'}else{timer=setInterval(()=>{seconds++;$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000);$('timerBtn').textContent='일시정지'}};$('timerReset').onclick=()=>{clearInterval(timer);timer=null;seconds=0;$('clock').textContent='00:00';$('timerBtn').textContent='타이머 시작'};render();
