<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="베토벤 환희의 송가 실제 연주와 악보로 호흡·프레이즈를 노래하는 중학교 음악 45분 수업"><title>노래의 숨길 · 환희의 송가 | MY MUSIC CLASS</title><style>:root{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#f7f3e9;background:#101923}*{box-sizing:border-box}body{margin:0;background:#101923;color:#f7f3e9}a{color:inherit}button{cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #ffc36e;outline-offset:3px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 3vw;background:#121e2a;border-bottom:1px solid #506474}.brand{font-size:14px;letter-spacing:.09em;color:#aac0cf;font-weight:850}.toplinks{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toplinks a{font-size:15px;color:#dce7ea;text-decoration:none}.timer{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}.timerBtn{background:#e5ae64;color:#1d2830;border:0;padding:8px 14px;border-radius:9px;font-weight:800}.main{max-width:1600px;margin:auto;padding:19px 3vw 30px}.titleline{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:15px}.titleline h1{font-size:clamp(35px,4.1vw,64px);font-weight:900;letter-spacing:-.045em;margin:3px 0}.titleline p{color:#b8c8d2;font-size:17px}.steps{display:flex;gap:9px;margin:14px 0 20px;flex-wrap:wrap}.steps button{background:transparent;border:1px solid #566878;border-radius:8px;color:#d6e5ea;padding:12px 15px;font-weight:800;font-size:17px}.steps button.on{background:#e4b374;color:#171d28;border-color:#e4b374}.stage{min-height:620px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:25px}.stageFull{grid-column:1/-1}.surface{background:#192a36;border:1px solid #465d6b;border-radius:14px;padding:clamp(17px,2vw,28px)}.eyebrow{font-size:16px;letter-spacing:.12em;color:#eac185;font-weight:850}.task{font-size:clamp(24px,2.7vw,38px);line-height:1.38;font-weight:850;letter-spacing:-.03em;margin:6px 0 16px}.frame{aspect-ratio:16/9;background:#05090e;border-radius:12px;overflow:hidden;position:relative}.frame iframe{width:100%;height:100%;border:0}.frame button{position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(145deg,#0a131eaa,#152333aa),url('https://i.ytimg.com/vi/TYE11oVhbmI/hqdefault.jpg') center/cover;border:0;color:white;font-weight:950;font-size:30px;text-shadow:1px 2px #101820}.secondaryLink{display:inline-flex;background:#263a48;border:1px solid #68808a;border-radius:9px;padding:8px 14px;text-decoration:none;font-weight:750;margin:9px 9px 0 0}.photo{position:relative;min-height:270px;overflow:hidden;border-radius:12px;background:#34475a}.photo img{width:100%;height:100%;min-height:270px;object-fit:cover}.photo small{position:absolute;bottom:0;left:0;right:0;padding:8px;background:#101923d9;color:#c9d4de;font-size:11px}.cardLabel{font-size:21px;font-weight:850;margin:12px 0}.focus{font-size:25px;font-weight:850;line-height:1.4;color:#f0d7b2}.number{font-size:clamp(44px,8vw,110px);font-weight:950;color:#f0b46e;line-height:1}.sheetWrap{background:#fffdf5;border-radius:14px;padding:12px;color:#142b3a}.sheetWrap svg{display:block;width:100%;height:auto}.measureBtn{border:1px solid #c8bdac;background:#fff;color:#294050;padding:8px 10px;border-radius:8px;font-weight:700}.measureBtn.selected{background:#edc98d;color:#1f303e}.miniTip{color:#adbfcb;font-size:16px;line-height:1.5}.panelBottom{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0}.panelBottom button{background:#f0b46e;color:#172636;border:0;border-radius:10px;font-weight:850;padding:14px 24px;font-size:19px}.panelBottom button:disabled{opacity:.3}.breathDuo{display:grid;grid-template-columns:1fr 1fr;gap:15px}.breathDuo button{background:#253c4b;border:2px solid #7890a1;color:white;border-radius:14px;min-height:180px;font-size:28px;font-weight:900;padding:16px}.breathDuo button.sel{border-color:#e4b374;background:#324e5e}.beat{display:flex;gap:12px;justify-content:center;margin:20px}.beat span{border-radius:50%;background:#466171;width:55px;height:55px;display:grid;place-items:center;font-weight:900;font-size:21px}.beat span.active{background:#f0b46e;color:#17202b}.shortNote{display:flex;gap:10px;align-items:center;background:#233948;padding:13px;border-radius:12px}.shortNote select{padding:12px;font-size:18px;border-radius:8px}.bigWords{font-size:clamp(32px,4vw,59px);font-weight:900;line-height:1.45;letter-spacing:.03em}.smallFoot{font-size:13px;color:#a4bac7;line-height:1.6}@media(max-width:1050px){.stage{grid-template-columns:1fr}.photo img{max-height:290px}.titleline p{font-size:15px}}@media(max-width:650px){.main{padding:13px}.top{padding:10px}.stage{gap:12px}.steps button{padding:9px;font-size:14px}.surface{padding:14px}.breathDuo{grid-template-columns:1fr}.frame button{font-size:22px}.toplinks a{font-size:12px}}</style></head><body>
<header class="top"><span class="brand">MY MUSIC CLASS / MUSIC IN ACTION</span><div class="toplinks"><a href="../">자료실</a><a href="teacher.html" target="_blank" rel="noopener">교사용 지도안</a><a href="worksheet.html" target="_blank" rel="noopener">활동지</a><a href="credits.html" target="_blank" rel="noopener">출처</a><button class="timerBtn" id="fullscreen">전체화면</button><span class="timer" id="timer">05:00</span><button class="timerBtn" id="timerButton">▶</button></div></header>
<div class="main"><div class="titleline"><div><span class="eyebrow">VOCAL LAB / 베토벤 교향곡 제9번 주제</span><h1>노래의 숨길</h1></div><p>45분 · 4개 큰 활동 · 교사와 함께 듣고 부르기</p></div><nav class="steps" aria-label="수업 흐름" id="steps"></nav><main id="stage" aria-live="polite"></main><footer class="panelBottom"><button id="prev">이전 활동</button><span id="status" style="font-size:17px;color:#c2d3dc">1 / 4</span><button id="next">다음 활동</button></footer></div>
<script>
"use strict";
const STAGES=[["연주로 시작하기",5],["선율을 몸에 익히기",15],["프레이즈를 바꾸어 부르기",15],["우리의 해석으로 마무리",10]];
const NOTES=[["E4","E4","F4","G4"],["G4","F4","E4","D4"],["C4","C4","D4","E4"],["E4","D4","D4:2"],["E4","E4","F4","G4"],["G4","F4","E4","D4"],["C4","C4","D4","E4"],["D4","C4","C4:2"]];
const $=id=>document.getElementById(id);
let current=0,seconds=STAGES[0][1]*60,clock=null,measure=0,breath="A",pulse=0,pulseId=null,videoStarted=false,exitChoice="선율의 의미";
function stop(){if(clock!==null){clearInterval(clock);clock=null}updateTimer()}
function updateTimer(){$("timer").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");$("timerButton").textContent=clock===null?"▶":"Ⅱ"}
function stopPulse(){if(pulseId!==null){clearInterval(pulseId);pulseId=null}pulse=0}
function go(n){if(n<0||n>=STAGES.length)return;stop();stopPulse();current=n;seconds=STAGES[n][1]*60;videoStarted=false;render();window.scrollTo({top:0,behavior:"smooth"})}
function q(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sheet(){const sy={C4:101,D4:95,E4:89,F4:83,G4:77};let txt='<svg viewBox="0 0 940 320" role="img" aria-label="환희의 송가 주제 8마디 4분의4박자 높은음자리표, C장조. 첫 네 마디 미 미 파 솔 솔 파 미 레 도 도 레 미 미 레 레. 뒤 네 마디 미 미 파 솔 솔 파 미 레 도 도 레 미 레 도 도.">';
for(let row=0;row<2;row++){let top=row*148+12;for(let i=0;i<5;i++){const y=top+41+i*12;txt+='<line x1="35" y1="'+y+'" x2="920" y2="'+y+'" stroke="#516578" stroke-width="1.5"/>'}txt+='<text x="41" y="'+(top+91)+'" font-size="65" fill="#14344a" font-family="serif">𝄞</text>';if(!row)txt+='<text x="92" y="'+(top+62)+'" font-size="23" font-weight="bold" fill="#243a4a">4</text><text x="92" y="'+(top+86)+'" font-size="23" font-weight="bold" fill="#243a4a">4</text>';
for(let col=0;col<4;col++){let bar=row*4+col,left=128+col*192;let dur=NOTES[bar].reduce((n,v)=>n+(v.includes(":2")?2:1),0);if(dur!==4)throw Error("bar duration");txt+='<rect x="'+(left-5)+'" y="'+(top+36)+'" width="185" height="68" rx="6" fill="'+(measure===bar?"#f2dfb9":"transparent")+'"/>';let x=left+19;for(const raw of NOTES[bar]){const [pitch,len]=raw.split(":"),y=top+sy[pitch],half=len==="2";if(pitch==="C4")txt+='<line x1="'+(x-16)+'" y1="'+(top+101)+'" x2="'+(x+16)+'" y2="'+(top+101)+'" stroke="#1b374b" stroke-width="2"/>';txt+='<ellipse cx="'+x+'" cy="'+y+'" rx="11" ry="7" transform="rotate(-23 '+x+' '+y+')" fill="'+(half?"#fff":"#172d43")+'" stroke="#172d43" stroke-width="2.2"/><line x1="'+(x+10)+'" y1="'+y+'" x2="'+(x+10)+'" y2="'+(y-34)+'" stroke="#172d43" stroke-width="2"/>';x+=half?70:44}txt+='<line x1="'+(left+184)+'" y1="'+(top+41)+'" x2="'+(left+184)+'" y2="'+(top+89)+'" stroke="#31485b" stroke-width="1.5"/><text x="'+(left+3)+'" y="'+(top+126)+'" font-size="19" font-weight="'+(measure===bar?"900":"600")+'" fill="#29485c">'+(bar+1)+'마디</text>'}}return txt+"</svg>"}
function picture(file,desc,credit){return '<div class="photo"><img loading="lazy" alt="'+q(desc)+'" src="https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file)+'?width=960"><small>'+q(credit)+'</small></div>'}
function video(){return '<div class="frame" id="frame">'+(videoStarted?'<iframe title="베를린 필하모닉 환희의 송가 공식 연주" src="https://www.youtube-nocookie.com/embed/TYE11oVhbmI?autoplay=1&rel=0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>':'<button type="button" id="playOfficial">공식 오케스트라 연주 듣기 · ▶</button>')+'</div><a class="secondaryLink" href="https://www.youtube.com/watch?v=TYE11oVhbmI" target="_blank" rel="noopener noreferrer">원본 영상 열기</a><a class="secondaryLink" href="https://www.youtube.com/watch?v=QH82a4XvQsw" target="_blank" rel="noopener noreferrer">런던 심포니 교향곡 제9번</a>'}
function page1(){return '<section class="stage"><div class="surface"><div class="eyebrow">ACT 01 · 5분 · 첫 2분 안에 음악</div><h2 class="task">먼저 연주를 듣습니다. 어디에서 숨을 쉬고 싶나요?</h2>'+video()+'<p class="miniTip">연주를 1분 들은 뒤, 들리는 선율의 시작과 끝을 손으로 그려 보세요.</p></div><aside class="surface">'+picture("Beethoven 1820.jpg","베토벤 초상화, 1820년 요제프 카를 슈틸러","Joseph Karl Stieler, 1820 / Public Domain")+'<p class="cardLabel">오늘 부를 선율</p><p class="focus">베토벤<br>교향곡 제9번 4악장<br>「환희의 송가」</p><p class="miniTip">선율을 듣고 → 따라 부르고 → 숨표를 바꾸어 표현합니다.</p></aside></section>'}
function page2(){return '<section class="stage"><div class="surface stageFull"><div class="eyebrow">ACT 02 · 15분 · 선율 실연</div><h2 class="task">악보를 보면서 4마디씩 노래해 봅시다.</h2><div class="sheetWrap" id="sheet">'+sheet()+'</div><div class="steps" id="measures">'+NOTES.map((v,i)=>'<button type="button" class="measureBtn '+(measure===i?"selected":"")+'" data-measure="'+i+'">'+(i+1)+'마디</button>').join("")+'</div><p class="focus">① 계이름으로 따라 부르기 7분　② 허밍으로 연결하기 8분</p><p class="miniTip">각 마디를 클릭하면 악보가 강조됩니다. 음원 대신 교사의 편안한 음역 시범을 따라 부르세요. 4/4박자, 다장조.</p></div></section>'}
function page3(){return '<section class="stage"><div class="surface"><div class="eyebrow">ACT 03 · 15분 · 호흡 비교</div><h2 class="task">같은 멜로디를 다른 숨표로 불러 봅시다.</h2><div class="breathDuo"><button type="button" data-breath="A" class="'+(breath==="A"?"sel":"")+'">A　4마디 뒤 숨쉬기<br><small>긴 프레이즈</small></button><button type="button" data-breath="B" class="'+(breath==="B"?"sel":"")+'">B　2마디 뒤 숨쉬기<br><small>짧은 프레이즈</small></button></div><div class="bigWords" style="margin:25px 0">미 미 파 솔 ｜ 솔 파 미 레<br>도 도 레 미 ｜ 미 레 레 ―</div><div class="shortNote"><b>선택한 숨표:</b> <span id="breathLabel">'+(breath==="A"?"4마디 후 호흡":"2마디 후 호흡")+'</span></div><p class="focus">A로 2회 → B로 2회 → 더 자연스러운 표현을 골라 부르기</p><button class="timerBtn" id="pulseButton">4박 시각 박자 시작 / 정지</button><div class="beat" id="beats">'+[1,2,3,4].map(n=>'<span>'+n+'</span>').join("")+'</div></div><aside class="surface">'+picture("CVG choir & orchestra by Michiel Hendrickx.jpg","실제 합창단과 오케스트라 공연 무대 사진","Michiel Hendryckx / Public Domain")+'<p class="cardLabel">호흡은 경주가 아닙니다</p><p class="focus">목에 힘을 빼고,<br>편안한 음역으로.</p><p class="miniTip">학생은 선택한 숨표로 허밍하거나 소리를 낮춰 노래할 수 있습니다.</p></aside></section>'}
function page4(){return '<section class="stage"><div class="surface"><div class="eyebrow">ACT 04 · 10분 · 음악으로 마무리</div><h2 class="task">우리 반의 「환희의 송가」를 완성해 봅시다.</h2><div class="sheetWrap">'+sheet()+'</div><p class="focus">6분　교사의 지휘에 따라 8마디를 두 번 합창</p><p class="focus">2분　A/B 숨표를 바꾸어 마지막으로 한 번</p><div class="shortNote"><label for="choice">2분　내가 고른 표현</label><select id="choice"><option>선율의 의미</option><option>편안한 호흡</option><option>음악적 연결</option></select><span>선택한 이유를 한 문장으로 말해 봅니다.</span></div></div><aside class="surface">'+picture("FSHS Choir.jpg","청소년 합창단 공연 사진","NaturalSoundsYEAH! / CC0")+'<p class="cardLabel">마지막 한 문장</p><p class="bigWords">“나는 ___에서 숨을 쉬니 선율이 ___하게 들렸다.”</p><p class="miniTip">학생 개별 자기 확인 · 형성평가. 큰 성량이나 긴 호흡을 강요하지 않습니다.</p></aside></section>'}
function render(){let names=STAGES;$("steps").innerHTML=names.map((s,i)=>'<button type="button" data-stage="'+i+'" class="'+(i===current?"on":"")+'">'+String(i+1).padStart(2,"0")+'　'+q(s[0])+' · '+s[1]+'분</button>').join("");$("stage").innerHTML=[page1,page2,page3,page4][current]();$("status").textContent=(current+1)+" / "+STAGES.length+" · "+STAGES[current][1]+"분";$("prev").disabled=current===0;$("next").disabled=current===3;updateTimer()}
function updateBeat(){const b=$("beats");if(!b)return;b.querySelectorAll("span").forEach((el,i)=>{el.className=i===pulse?"active":""})}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.stage!==undefined)go(+b.dataset.stage);if(b.dataset.measure!==undefined){measure=+b.dataset.measure;render()}if(b.dataset.breath!==undefined){breath=b.dataset.breath;render()}if(b.id==="playOfficial"){videoStarted=true;render()}if(b.id==="pulseButton"){if(pulseId!==null){stopPulse();updateBeat();b.textContent="4박 시각 박자 시작 / 정지"}else{pulse=0;updateBeat();pulseId=setInterval(()=>{pulse=(pulse+1)%4;updateBeat()},666);b.textContent="시각 박자 정지"}}});
$("prev").onclick=()=>go(current-1);$("next").onclick=()=>go(current+1);$("timerButton").onclick=()=>{if(clock!==null){stop();return}clock=setInterval(()=>{seconds=Math.max(0,seconds-1);if(seconds===0)stop();else updateTimer()},1000);updateTimer()};$("fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(document.hidden){stop();stopPulse()}});render();
</script></body></html>
