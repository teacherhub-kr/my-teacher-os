<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노래의 숨길 · 가창 프레이징 45분</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f9ff;color:#173c59;font:18px/1.55 system-ui,'Malgun Gothic',sans-serif}header{padding:20px 5%;background:#fff;border-bottom:5px solid #e7a86d}h1{font-size:clamp(32px,4vw,50px);margin:8px 0}h2{font-size:clamp(27px,3vw,36px)}.layout{max-width:1200px;margin:20px auto;padding:0 18px;display:grid;grid-template-columns:240px 1fr;gap:20px}nav,main{background:#fff;border:1px solid #d2dfe8;border-radius:22px;padding:20px}nav button{display:block;width:100%;text-align:left;margin:5px 0}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{flex:1}button,a.action{background:#fff4e9;color:#75401d;border:1px solid #e8c4a3;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}button.active{background:#9b4b3d;color:white}.panel{background:#f4f9fc;border:1px solid #cce1e9;border-radius:16px;padding:18px;margin:16px 0}.guide{background:#fff6e8;border:1px solid #e8d0a8;border-radius:16px;padding:16px;margin:15px 0}.hidden{display:none}textarea{width:100%;min-height:90px;border:1px solid #abcbd9;border-radius:10px;padding:12px;font:inherit}#clock{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}.words{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.words button{font-size:20px}.words button.marked{background:#f7d3c0;border-color:#bb7751}footer{display:flex;justify-content:space-between;align-items:center;gap:10px}button:focus-visible,textarea:focus-visible{outline:3px solid #269eac}@media(max-width:750px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto}nav button{min-width:165px}}</style></head><body><header><p>중학교 2학년 · 2022 개정 음악과 · 연주 · 45분</p><h1>🎤 노래의 숨길</h1><p>숨표와 가사의 의미를 연결해 나만의 프레이즈를 설계하고 표현하기</p><div class="controls"><a class="action" href="teacher.html">교사용 지도안</a><a class="action" href="worksheet.html">학생 활동지</a><button id="full">전체화면</button><button id="guideBtn">교사 해설</button><b id="clock">04:00</b><button id="timerBtn">▶ 타이머</button><button id="reset">초기화</button></div></header><div class="layout"><nav id="nav" aria-label="10개 수업 장면"></nav><main><p id="stepLabel"></p><h2 id="heading"></h2><p id="task"></p><section class="panel" id="activity"></section><section id="guide" class="guide hidden"></section><footer><button id="prev">← 이전</button><b id="count"></b><button id="next">다음 →</button></footer></main></div><script>
const S=[["목소리도 악기다",4,"자연스럽게 말한 한 문장과 편안히 부른 한 문장의 차이를 관찰하세요.","말할 때와 노래할 때 숨의 흐름이 어떻게 다르게 느껴지나요?","노래할 때 숨을 조금 더 길게 이어 쓰게 됩니다.","목에 힘을 주거나 큰 소리를 내게 하지 않습니다."],["몸과 호흡 준비",5,"편안히 서거나 앉아 어깨 힘을 빼고, 조용히 들이마신 뒤 ‘스—’로 숨을 내쉽니다.","어깨를 올리지 않고도 숨을 들이마실 수 있나요?","어깨를 과하게 올리지 않아도 숨을 쉴 수 있어요.","어지럽거나 불편하면 즉시 멈추고 평상 호흡으로 돌아옵니다."],["프레이즈 알아보기",5,"하나의 음악적 생각을 끊지 않고 표현하는 구간을 찾아봅니다.","어느 부분에서 자연스럽게 숨을 쉬어야 말뜻이 살아날까요?","의미가 끝나는 곳에서 숨을 쉬는 게 자연스러워요.","프레이즈는 무조건 한 호흡으로 길게 버티는 경쟁이 아닙니다."],["가사와 숨표",5,"두 문장의 뜻을 읽고 숨표(,)를 넣을 위치를 골라 봅니다.","어떤 숨표가 가사의 의미를 덜 끊나요?","‘오늘도 함께 / 노래해요’처럼 의미가 이어지는 곳을 생각해요.","제시 가사는 이 수업을 위해 새로 작성한 창작 문장입니다."],["같은 문장 두 표현",5,"교사의 시범을 듣고 자연스러운 연결과 끊긴 연결을 비교합니다.","어떤 표현에서 말의 뜻이 잘 들리나요?","단어 사이를 불필요하게 끊지 않은 표현이에요.","교사 시범은 편안한 음역에서 말하듯 부르며 음량 경쟁을 피합니다."],["나만의 프레이즈 설계",8,"제시된 짧은 창작 가사를 선택해 숨표와 강조할 단어를 정합니다.","왜 그 단어를 강조하고 그 위치에서 숨을 쉬나요?","‘함께’를 강조하면 같이 노래하는 뜻이 잘 전달돼요.","학생마다 호흡 길이가 달라도 표현 이유가 명확하면 인정합니다."],["한 번 불러 보고 수정",5,"자신이 설계한 숨표에 맞춰 편안히 노래하거나 허밍하고 수정합니다.","직접 해보니 어디가 불편하거나 자연스러웠나요?","숨표를 한 단어 뒤로 옮기니 더 편안했어요.","변성기 학생은 낮은 음역, 허밍, 말리듬 대체를 허용합니다."],["짝 없이 개별 점검",3,"자기 기록에서 가사 의미, 숨표, 강조 단어가 연결되는지 확인합니다.","설계와 표현의 관계를 한 문장으로 설명할 수 있나요?","뜻이 이어지는 부분을 붙여 부르려고 숨표를 옮겼어요.","다른 학생 앞에서 독창을 강요하지 않습니다."],["형성평가 퀴즈",3,"프레이즈와 건강한 발성에 관한 세 문항을 풉니다.","가창에서 가장 중요한 것은 오래 버티는 것일까요?","아니요. 편안한 호흡과 의미 전달이 중요합니다.","형성평가이며 정규 수행평가 점수에 추가하지 않습니다."],["종료 티켓",2,"내가 정한 숨표 한 곳과 그 이유를 문장으로 기록합니다.","오늘의 프레이즈 설계에서 바꾼 한 가지는 무엇인가요?","가사의 의미가 끊기지 않게 숨표를 바꿨어요.","이름·학번·음성 녹음을 요구하지 않습니다."]],Q=[["프레이즈를 가장 잘 설명한 것은?",["의미 있는 음악적 구간","가장 큰 소리로 내는 부분","최대한 오래 숨을 참는 것"],0,"프레이즈는 음악적 의미를 갖는 표현 구간입니다."],["숨표를 정할 때 우선 고려할 것은?",["가사의 의미와 편안한 호흡","무조건 매 단어 뒤에 쉼","친구보다 긴 호흡"],0,"뜻과 호흡의 자연스러움을 함께 살핍니다."],["목이 불편한 학생에게 적절한 선택은?",["더 세게 부르기","허밍·말리듬으로 대체하고 쉬기","고음만 반복하기"],1,"불편할 때 무리하지 않고 대체 활동을 합니다."]];let step=0,elapsed=0,timer=null,guide=false,notes={},breakAt=2,emphasis=1,answers={};const $=x=>document.getElementById(x),safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\u0027':'&#39;'}[c]));const words=['오늘도','함께','노래해요'];function clock(){const n=Math.max(0,S[step][1]*60-elapsed);$('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');$('timerBtn').textContent=timer?'Ⅱ 일시정지':'▶ 타이머';$('timerBtn').disabled=n===0}function pause(){if(timer!==null){clearInterval(timer);timer=null}clock()}function reset(){pause();elapsed=0;clock()}function move(n){pause();step=Math.max(0,Math.min(9,n));reset();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const s=S[step];$('nav').innerHTML=S.map((v,i)=>'<button data-step="'+i+'" class="'+(step===i?'active':'')+'">'+(i+1)+'. '+safe(v[0])+' · '+v[1]+'분</button>').join('');$('stepLabel').textContent='장면 '+(step+1)+' · '+s[1]+'분';$('heading').textContent=s[0];$('task').textContent=s[2];$('count').textContent=(step+1)+' / 10';$('prev').disabled=step===0;$('next').disabled=step===9;$('guide').classList.toggle('hidden',!guide);$('guide').innerHTML='<h3>교사 발문</h3><p>'+safe(s[3])+'</p><h3>예상 답변</h3><p>'+safe(s[4])+'</p><h3>지도 유의</h3><p>'+safe(s[5])+'</p>';let h='';if(step===5||step===6||step===7){h='<h3>🎼 원본 창작 가사: 오늘도 함께 노래해요</h3><p>숨표를 넣을 위치를 선택하세요.</p><div class="words">'+words.map((w,i)=>'<button data-break="'+i+'" class="'+(breakAt===i?'marked':'')+'">'+safe(w)+(breakAt===i?' /':'')+'</button>').join('')+'</div><p>강조할 단어를 고르세요.</p><div class="words">'+words.map((w,i)=>'<button data-emph="'+i+'" class="'+(emphasis===i?'active':'')+'">'+safe(w)+'</button>').join('')+'</div><p><b>나의 설계:</b> '+words.map((w,i)=>(i===emphasis?'★':'')+safe(w)+(i===breakAt?' / ':' ')).join('')+'</p><p>원하는 편안한 음높이로 노래하거나 허밍·말리듬으로 표현하세요. 녹음은 하지 않습니다.</p>'}else if(step===8){h='<h3>형성평가</h3>'+Q.map((q,i)=>'<p><b>'+(i+1)+'. '+safe(q[0])+'</b></p><div class="controls">'+q[1].map((v,j)=>'<button data-q="'+i+'" data-choice="'+j+'" class="'+(answers[i]===j?'active':'')+'">'+safe(v)+'</button>').join('')+'</div><p>'+(answers[i]===undefined?'답을 선택하세요.':(answers[i]===q[2]?'✓ 정답. ':'다시 생각하세요. ')+safe(q[3]))+'</p>').join('')}else{h='<h3>개별 생각 기록</h3><textarea id="note" placeholder="이름·학번을 쓰지 마세요. 작성 내용은 외부로 전송하거나 저장하지 않습니다.">'+safe(notes[step]||'')+'</textarea>'}$('activity').innerHTML=h;clock()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined)move(+b.dataset.step);if(b.dataset.break!==undefined){breakAt=+b.dataset.break;render()}if(b.dataset.emph!==undefined){emphasis=+b.dataset.emph;render()}if(b.dataset.q!==undefined){answers[+b.dataset.q]=+b.dataset.choice;render()}});document.addEventListener('input',e=>{if(e.target.id==='note')notes[step]=e.target.value});$('prev').onclick=()=>move(step-1);$('next').onclick=()=>move(step+1);$('timerBtn').onclick=()=>{if(timer!==null){pause();return}timer=setInterval(()=>{elapsed++;if(elapsed>=S[step][1]*60)pause();else clock()},1000);clock()};$('reset').onclick=reset;$('guideBtn').onclick=()=>{guide=!guide;$('guideBtn').textContent=guide?'해설 숨기기':'교사 해설';render()};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});render();
</script></body></html>
