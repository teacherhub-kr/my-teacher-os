<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>판소리의 추임새 · PPT × HTML 하이브리드 시범 | MY MUSIC CLASS</title>
<style>
:root{--ink:#14232a;--navy:#193640;--cream:#f6efe3;--gold:#e5b46e;--sub:#bfd2d4;--stroke:rgba(241,222,189,.23);--red:#f4a9a0;--green:#bde4be;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0d1b21;color:var(--cream)}button,a{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 85% 5%,#315260 0%,transparent 38%),var(--ink)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 24px;background:#0d1b21;border-bottom:1px solid var(--stroke)}
.brand{font-weight:850;letter-spacing:.08em;color:var(--gold)}.sub{font-size:13px;color:var(--sub)}.toolbar-actions,.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:40px;border-radius:12px;padding:9px 15px;border:1px solid var(--stroke);background:#25414a;color:var(--cream);font-weight:700}
.btn:hover{background:#345866}.btn.primary{background:var(--gold);color:#201d16}.btn[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--gold)}
.stage-shell{display:flex;flex:1;align-items:center;justify-content:center;padding:clamp(12px,2.5vw,35px)}
.stage{width:min(100%,1400px);min-height:500px;aspect-ratio:16/9;border:1px solid var(--stroke);border-radius:24px;box-shadow:0 30px 70px #0005;overflow:hidden;position:relative;background:radial-gradient(circle at 110% -20%,#3e6268 0,transparent 42%),linear-gradient(135deg,#1a333a,#10252f 65%,#18333a)}
.stage:before{content:"";position:absolute;inset:28px;border:1px solid rgba(241,222,189,.12);border-radius:14px;pointer-events:none}
.stage:after{content:"";position:absolute;width:250px;height:250px;right:-112px;bottom:-115px;border:36px solid rgba(229,180,110,.08);border-radius:50%;pointer-events:none}
.content{height:100%;padding:clamp(28px,4.3vw,66px);display:flex;flex-direction:column;gap:clamp(12px,2vw,24px);position:relative;z-index:1}
.kicker{color:var(--gold);letter-spacing:.12em;font-size:clamp(13px,1.5vw,20px);font-weight:850}
h1{font-size:clamp(35px,5vw,76px);line-height:1.16;letter-spacing:-.04em;margin:0;white-space:pre-line;word-break:keep-all}
.prompt{font-size:clamp(17px,2vw,27px);line-height:1.5;color:#e1e7e5;max-width:1050px;margin:0;word-break:keep-all}
.hero{margin-top:auto;display:flex;gap:16px;align-items:center}
.glyph{font-family:serif;color:var(--gold);font-size:clamp(90px,16vw,210px);line-height:1}
.hero .question{font-size:clamp(22px,3vw,41px);font-weight:850;max-width:640px}
.media{border:1px solid var(--stroke);border-radius:15px;background:#080b0e;aspect-ratio:16/9;position:relative;overflow:hidden;width:min(100%,690px)}
.media iframe{width:100%;height:100%;border:0}.media-cover{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:linear-gradient(135deg,#243f46,#0e1d25);gap:9px}
.media-cover button{background:var(--gold);color:#201d16;border:0;border-radius:100px;width:75px;height:75px;font-size:36px}.media-row{display:flex;gap:24px;align-items:center;margin-top:auto}
.media-caption{color:var(--sub);font-size:clamp(13px,1.4vw,17px);max-width:300px}
.media-caption a{color:var(--gold)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:auto}.card{background:#29464d;border:1px solid var(--stroke);border-radius:16px;padding:clamp(15px,2vw,27px);min-height:140px;text-align:left;color:var(--cream)}.card b{font-size:clamp(21px,2.8vw,36px);color:var(--gold)}.card p{font-size:clamp(15px,1.6vw,22px);margin:12px 0 0}.card.revealed{background:#355663;border-color:var(--gold)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:auto}.choice{font-size:clamp(17px,2vw,27px);border-radius:14px;border:2px solid var(--stroke);background:#2c4850;color:var(--cream);padding:20px;text-align:left;min-height:115px}.choice.active{border-color:var(--gold)}.choice.good{background:#204a3d;border-color:var(--green)}.choice.bad{background:#58352f;border-color:var(--red)}.result{min-height:35px;color:var(--gold);font-size:clamp(15px,1.5vw,20px)}.action-row{display:flex;gap:12px;flex-wrap:wrap}
.practice-cues{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}.cue{background:#31535c;border:1px solid var(--stroke);border-radius:16px;padding:18px 24px;color:var(--gold);font-size:clamp(22px,3vw,40px);font-weight:850}
.checks{margin-top:auto;display:grid;gap:14px;font-size:clamp(20px,3vw,35px)}.checks label{display:flex;gap:14px;align-items:center}.checks input{width:30px;height:30px;accent-color:var(--gold)}
.footer{padding:12px 24px;border-top:1px solid var(--stroke);background:#0d1b21;display:flex;align-items:center;gap:18px;justify-content:space-between}.progress{flex:1;display:flex;gap:5px;max-width:500px}.dot{height:7px;flex:1;background:#35505a;border-radius:10px}.dot.current{background:var(--gold)}.page{color:var(--sub);font-size:14px}
.notes{position:fixed;z-index:10;right:16px;top:80px;width:min(400px,calc(100vw - 32px));background:#faf2e5;color:#263c3e;border-radius:16px;padding:26px;box-shadow:0 20px 60px #0008}.notes h2{margin:0 0 12px}.notes p{line-height:1.6}.notes[hidden]{display:none}
.app[data-mode=activity] .stage{aspect-ratio:auto;min-height:650px;max-width:1000px}.app[data-mode=activity] .stage-shell{align-items:flex-start}.app[data-mode=activity] .content{padding:clamp(24px,4vw,48px)}.app[data-mode=activity] h1{font-size:clamp(36px,5vw,60px)}
@media(max-width:850px){.toolbar{padding:12px;align-items:flex-start}.toolbar-actions{justify-content:flex-end}.brand{font-size:13px}.stage-shell{padding:8px}.stage{min-height:550px;aspect-ratio:auto}.stage:before{inset:10px}.content{padding:25px}.cards,.choices{grid-template-columns:1fr}.media-row{flex-direction:column;align-items:stretch}.media{width:100%}.footer{padding:12px;flex-wrap:wrap}.footer .progress{order:3;min-width:100%;max-width:none}.sub{display:none}.btn{padding:9px 11px}}
@media print{.toolbar,.footer,.notes{display:none!important}.stage{border:0;box-shadow:none;aspect-ratio:auto;min-height:0}.stage-shell{padding:0}body,.app{background:#fff!important;color:#111!important}}
</style></head><body><div class="app" id="app" data-mode="present">
<header class="toolbar"><div><div class="brand">MY MUSIC CLASS <span class="sub">· 중학교 2학년 음악</span></div><div class="sub">판소리의 추임새 · 45분 하이브리드 시범</div></div><div class="toolbar-actions">
<button class="btn" id="mode" aria-pressed="false">활동 모드 (M)</button><button class="btn" id="notesBtn">교사 노트 (N)</button><button class="btn" id="timer">45:00 · 시작</button><button class="btn" id="full">전체화면 (F)</button></div></header>
<main class="stage-shell"><section class="stage" aria-live="polite"><div class="content" id="content"></div></section></main>
<footer class="footer"><div class="controls"><button class="btn" id="prev">← 이전</button><button class="btn primary" id="next">다음 →</button></div><div class="progress" id="progress"></div><div class="page" id="page"></div></footer>
<aside class="notes" id="notes" hidden><h2>교사용 발문·안내</h2><div id="noteText"></div><p><a href="./teacher.html" target="_blank" rel="noopener">기존 교사용 지도안</a></p><button class="btn" id="notesClose">닫기</button></aside>
<script>
"use strict";
const SCENES=[{"type":"cover","eyebrow":"01 · 첫 소리","title":"소리꾼의 노래에\n누가 응답할까?","question":"판소리 「수궁가」를 듣고 소리꾼·고수·청중의 소리를 구별해 봅시다.","minute":5,"teacher":"첫 2분 안에 공식 영상을 재생한다. 학교망에서 영상이 안 열리면 교사가 직접 ‘얼씨구’를 시범한다."},{"type":"listen","eyebrow":"02 · 소리 듣기","title":"귀로 듣고\n몸으로 느끼기","question":"소리꾼의 창과 고수의 북을 각각 찾아보세요.","minute":6,"teacher":"실제 영상 속에 들리는 소리만 근거로 질문한다. 공식 채널 재생 가능 여부를 수업 전 점검한다."},{"type":"cards","eyebrow":"03 · 소리의 역할","title":"판소리를 만드는\n세 가지 소리","question":"카드를 눌러 각 역할을 확인하세요.","minute":6,"cards":[["소리꾼","창·아니리로 이야기를 이끈다"],["고수","북으로 장단을 짚고 소리에 응답한다"],["청중","적절한 순간에 호응하며 참여한다"]],"teacher":"청중의 호응과 고수의 추임새를 구분해 설명한다."},{"type":"quiz","eyebrow":"04 · 듣기 퀴즈","title":"지금 들린 소리는\n무엇일까?","question":"고수가 판소리에서 맡는 역할은?","minute":5,"options":["노래 가사를 모두 대신 부른다","북 장단을 짚고 소리에 응답한다","노랫말을 화면에 적는다"],"correct":1,"explain":"고수는 북 장단을 짚으며 소리꾼과 상호작용합니다.","teacher":"발표 모드에서는 학생들이 먼저 손으로 답을 표시한 뒤 ‘정답 확인’을 누른다."},{"type":"compare","eyebrow":"05 · 추임새 탐구","title":"언제 ‘얼씨구’를\n넣어야 할까?","question":"교사의 같은 구절을 세 번 듣고 A·B 중 더 자연스러운 순간을 선택하세요.","minute":5,"options":["소리꾼의 중요한 음절 위에 겹치기","소리의 흐름에 어울리는 틈에서 응답하기"],"correct":1,"explain":"맥락에 따라 다르지만 소리의 흐름을 살리는 호응이 중요합니다.","teacher":"실제 음원 속 추임새의 정확한 초 단위 위치는 미확인이다. 교사가 직접 소리 구절을 반복해 비교한다."},{"type":"practice","eyebrow":"06 · 소리로 표현","title":"내가 고수가\n되어 봅시다","question":"교사의 소리에 맞춰 손짓 → 작은 목소리 → 추임새로 응답합니다.","minute":8,"teacher":"목소리 대신 손짓·카드를 허용한다. 학생마다 추임새 위치를 직접 선택하도록 한다."},{"type":"practice","eyebrow":"07 · 짝과 주고받기","title":"같은 소리,\n다른 응답","question":"같은 구절을 두 번 듣고 추임새 위치를 바꾸어 비교하세요.","minute":5,"teacher":"학생 개인별 실연을 확인하되 적극성이나 음량을 평가 기준으로 삼지 않는다."},{"type":"check","eyebrow":"08 · 오늘의 평가","title":"내 귀와 소리로\n확인하기","question":"① 역할 구별 ② 흐름에 맞춘 시점 선택 ③ 소리·손짓으로 표현","minute":3,"teacher":"개인 형성평가. 역할 구별과 음악적 시점 선택의 근거에 집중한다."},{"type":"closing","eyebrow":"09 · 정리","title":"추임새는\n함께 만드는 음악","question":"판소리에서 고수와 청중의 응답이 필요한 이유를 한 문장으로 말해보세요.","minute":2,"teacher":"말하기가 어려운 학생은 역할 카드를 제시하도록 한다."}];
const $=id=>document.getElementById(id);
let scene=0,mode="present",remaining=2700,running=null,selected={},revealed={},cardOpen={};
try{let s=JSON.parse(sessionStorage.getItem("pansoriHybridPreview")||"null");if(s){scene=Math.min(Math.max(0,s.scene||0),SCENES.length-1);mode=s.mode==="activity"?"activity":"present";remaining=Number.isFinite(s.remaining)?s.remaining:2700;selected=s.selected||{};revealed=s.revealed||{};cardOpen=s.cardOpen||{}}}catch(e){}
function save(){try{sessionStorage.setItem("pansoriHybridPreview",JSON.stringify({scene,mode,remaining,selected,revealed,cardOpen}))}catch(e){}}
function node(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function add(parent,tag,cls,txt){let n=node(tag,cls,txt);parent.append(n);return n}
function render(){
const s=SCENES[scene],root=$("content");root.replaceChildren();$("app").dataset.mode=mode;$("mode").textContent=mode==="present"?"활동 모드 (M)":"발표 모드 (M)";$("mode").setAttribute("aria-pressed",String(mode==="activity"));
add(root,"div","kicker",s.eyebrow);add(root,"h1","",s.title);add(root,"p","prompt",s.question);
if(s.type==="cover"||s.type==="closing"){let hero=add(root,"div","hero");add(hero,"div","glyph",s.type==="cover"?"樂":"聲");add(hero,"div","question",s.type==="cover"?"듣기 · 살피기 · 응답하기":"소리를 듣고 서로 응답하는 음악");}
if(s.type==="listen"){let row=add(root,"div","media-row"),media=add(row,"div","media");let poster=add(media,"div","media-cover");add(poster,"strong","", "국립국악원 공식 공연 영상 · 수궁가 ‘토끼화상’");let play=add(poster,"button","","▶");play.setAttribute("aria-label","공식 영상 재생");play.onclick=()=>{poster.remove();let iframe=add(media,"iframe");iframe.title="국립국악원 공식 판소리 영상";iframe.allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture";iframe.allowFullscreen=true;iframe.src="https://www.youtube-nocookie.com/embed/DldHHX0N0gg?rel=0";};let cap=add(row,"div","media-caption");add(cap,"p","","영상이 열리지 않으면 교사의 직접 소리 시범으로 진행합니다.");let link=add(cap,"a","","공식 유튜브에서 열기");link.href="https://www.youtube.com/watch?v=DldHHX0N0gg";link.target="_blank";link.rel="noopener noreferrer";}
if(s.type==="cards"){let grid=add(root,"div","cards");s.cards.forEach(([t,d],i)=>{let btn=add(grid,"button","card");btn.setAttribute("aria-expanded",String(!!cardOpen[scene+":"+i]));add(btn,"b","",t);add(btn,"p","",cardOpen[scene+":"+i]?d:"눌러서 역할 보기");if(cardOpen[scene+":"+i])btn.classList.add("revealed");btn.onclick=()=>{cardOpen[scene+":"+i]=!cardOpen[scene+":"+i];save();render()};});}
if(s.type==="quiz"||s.type==="compare"){let choices=add(root,"div","choices");s.options.forEach((t,i)=>{let btn=add(choices,"button","choice",String.fromCharCode(65+i)+". "+t);if(selected[scene]===i)btn.classList.add("active");if(revealed[scene]&&i===s.correct)btn.classList.add("good");if(revealed[scene]&&selected[scene]===i&&i!==s.correct)btn.classList.add("bad");btn.onclick=()=>{if(!revealed[scene]){selected[scene]=i;save();render()}}});let msg=add(root,"p","result",revealed[scene]?s.explain:mode==="present"?"반 전체가 선택한 뒤 정답을 공개하세요.":"답을 선택한 뒤 확인하세요.");let actions=add(root,"div","action-row");let reveal=add(actions,"button","btn primary",revealed[scene]?"다시 풀기":"정답 확인");reveal.onclick=()=>{if(revealed[scene]){delete selected[scene];delete revealed[scene]}else if(selected[scene]!==undefined){revealed[scene]=true}save();render()};}
if(s.type==="practice"){let cues=add(root,"div","practice-cues");["얼씨구!","좋다!","으이!"].forEach(t=>{let b=add(cues,"button","cue",t);b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true")});}
if(s.type==="check"){let checks=add(root,"div","checks");["역할을 구별했다","추임새 위치를 선택했다","소리나 손짓으로 표현했다"].forEach((t,i)=>{let lab=add(checks,"label");let input=add(lab,"input");input.type="checkbox";input.checked=!!cardOpen["check"+i];input.onchange=()=>{cardOpen["check"+i]=input.checked;save()};add(lab,"span","",t)});}
$("noteText").textContent=s.teacher+" · 이번 화면 "+s.minute+"분. 전체 45분 중 "+SCENES.slice(0,scene+1).reduce((x,a)=>x+a.minute,0)+"분까지 진행.";$("page").textContent=(scene+1)+" / "+SCENES.length;$("prev").disabled=scene===0;$("next").disabled=scene===SCENES.length-1;let prog=$("progress");prog.replaceChildren();SCENES.forEach((_,i)=>{let dot=add(prog,"div","dot");if(i<=scene)dot.classList.add("current");dot.title=(i+1)+"장면"});save();
}
function move(d){let n=Math.min(SCENES.length-1,Math.max(0,scene+d));if(n!==scene){scene=n;render()}}
function changeMode(){mode=mode==="present"?"activity":"present";$("app").dataset.mode=mode;$("mode").textContent=mode==="present"?"활동 모드 (M)":"발표 모드 (M)";$("mode").setAttribute("aria-pressed",String(mode==="activity"));save()}
function timerText(){let m=String(Math.floor(remaining/60)).padStart(2,"0"),s=String(remaining%60).padStart(2,"0");$("timer").textContent=m+":"+s+(running?" · 정지":" · 시작")}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("mode").onclick=changeMode;$("notesBtn").onclick=()=>{$("notes").hidden=!$("notes").hidden};$("notesClose").onclick=()=>{$("notes").hidden=true};
$("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
$("timer").onclick=()=>{if(running){clearInterval(running);running=null}else if(remaining>0){running=setInterval(()=>{remaining=Math.max(0,remaining-1);if(remaining===0){clearInterval(running);running=null}timerText();save()},1000)}timerText()};
document.addEventListener("keydown",e=>{let tag=document.activeElement?.tagName;if(["INPUT","TEXTAREA","SELECT"].includes(tag))return;if(e.key==="m"||e.key==="M"){changeMode();return}if(e.key==="n"||e.key==="N"){$("notesBtn").click();return}if(e.key==="f"||e.key==="F"){$("full").click();return}if(["ArrowRight","PageDown"].includes(e.key)||e.key===" "&&tag!=="BUTTON"){e.preventDefault();move(1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();move(-1)}});
let sx;document.querySelector(".stage").addEventListener("touchstart",e=>{sx=e.touches[0]?.clientX},{passive:true});document.querySelector(".stage").addEventListener("touchend",e=>{if(sx===undefined)return;let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>85)move(d<0?1:-1);sx=undefined},{passive:true});
render();timerText();
</script></div></body></html>
