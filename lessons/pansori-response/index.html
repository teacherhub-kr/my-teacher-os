<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판소리의 추임새 | MY MUSIC CLASS</title><style>*{box-sizing:border-box}body{margin:0;background:#102631;color:#fff;font:20px/1.55 system-ui,'Malgun Gothic',sans-serif}header{padding:14px 3vw;background:#183844;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}button,a.action{font:inherit;border:0;border-radius:10px;background:#ffd78e;color:#172d38;padding:12px 18px;cursor:pointer;text-decoration:none;font-weight:800}button:disabled{opacity:.35}main{max-width:1300px;margin:20px auto;padding:20px}h1{font-size:clamp(38px,5vw,68px);line-height:1.15}h2{font-size:clamp(29px,4vw,48px)}.lead{font-size:clamp(23px,3vw,36px)}.stage{border:1px solid #57717a;background:#1c3c47;border-radius:20px;padding:clamp(20px,4vw,45px);min-height:420px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.small{font-size:17px;color:#c7d8dd}.answer{margin-top:20px;color:#ffe2a8;font-weight:bold}.hidden{display:none}@media print{header,.actions{display:none}body{background:white;color:black}.stage{border:1px solid #999;background:white}}</style></head><body><header><b>MY MUSIC CLASS · 판소리의 추임새</b><div><button id="timer" aria-label="45분 타이머 시작 또는 일시정지">45:00 · 시작</button> <button id="full">전체화면</button> <button id="notes">교사 메모</button></div></header><main><div id="counter" class="small"></div><section class="stage"><h1 id="title"></h1><p id="lead" class="lead"></p><div id="activity"></div><p id="memo" class="small hidden"></p></section><div class="actions"><button id="prev">이전</button><button id="next">다음</button></div></main><script>const stages=[["먼저 소리를 들어 봅시다","소리꾼과 고수는 어떻게 서로 응답할까요?","<a class=\"action\" href=\"https://academy.gugak.go.kr/open/open/lecture/detail.do?openLectureSeq=659\" target=\"_blank\" rel=\"noopener noreferrer\">국립국악원 공식 영상 페이지 열기</a><p class=\"small\">수궁가 ‘토끼화상’ · 소리 정회석 · 고수 정준호</p>",5,"0~5분. 1분 이내 공식 영상 링크 클릭. 재생이 안 되면 교사가 직접 판소리 한 구절을 소리 내고 북 장단을 책상으로 짚는다."],["소리꾼·고수·청중","소리꾼의 노래와 고수의 북 장단을 구별해 봅시다.","<p class=\"lead\">창(노래) · 아니리(말) · 북 장단 · 추임새</p><a class=\"action\" href=\"https://academy.gugak.go.kr/open/open/lecture/detail.do?openLectureSeq=659\" target=\"_blank\" rel=\"noopener noreferrer\">같은 실연 다시 듣기</a>",10,"5~15분. 공식 영상 두 차례 듣기. 고수의 북과 추임새를 구별. 영상에서 실제 들리지 않은 추임새를 있다고 단정하지 않는다."],["추임새가 들어갈 자리","소리꾼의 흐름을 살리는 응답은 언제일까요?","<p class=\"lead\">A. 소리꾼의 중요한 음절 위에 겹치기</p><p class=\"lead\">B. 소리 흐름에 어울리는 틈에서 응답하기</p><div class=\"actions\"><button onclick=\"choose('A')\">A 선택</button><button onclick=\"choose('B')\">B 선택</button></div><div id=\"answer\" class=\"answer\" aria-live=\"polite\"></div>",10,"15~25분. 교사가 같은 짧은 소리 구절을 3회 실연한다. 학생은 응답할 시점을 손으로 표시하고 선택 이유를 말한다. 추임새가 항상 구절 끝에만 온다고 가르치지 않는다."],["내가 고수가 되어 보기","교사의 소리에 맞춰 ‘얼씨구’, ‘좋다’를 넣어 봅시다.","<p class=\"lead\">1차: 손짓으로 시점 표시 → 2차: 작은 목소리로 응답 → 3차: 시점 바꾸어 비교</p><p>목소리 대신 손짓이나 카드로도 참여할 수 있습니다.</p>",15,"25~40분. 교사가 실제 구음으로 반복. 3~4명씩 차례로 실연하되 모든 학생이 개별로 타이밍을 선택. 음량·적극성은 평가하지 않는다."],["오늘의 소리 확인","내가 선택한 추임새 위치를 한 번 보여 주세요.","<p class=\"lead\">① 소리꾼과 고수의 역할 구별</p><p class=\"lead\">② 소리 흐름에 어울리는 시점 선택</p><p class=\"lead\">③ 추임새 또는 손짓으로 표현</p>",5,"40~45분. 개별 형성평가. 근거 2개: 역할 구별과 음악적 흐름에 맞춘 시점. 필기 없이 실연·구술·손짓 선택."]];let i=0,remaining=2700,timer=null;const $=x=>document.getElementById(x);function render(){const s=stages[i];$('counter').textContent=(i+1)+' / '+stages.length+' · '+s[3]+'분';$('title').textContent=s[0];$('lead').textContent=s[1];$('activity').innerHTML=s[2];$('memo').textContent=s[4];$('prev').disabled=i===0;$('next').disabled=i===stages.length-1}function choose(x){$('answer').textContent=x==='B'?'소리의 흐름과 호흡을 고려한 선택입니다. 실제 공연에서는 맥락에 따라 위치가 달라질 수 있어요.':'노래의 중요한 음절을 가릴 수 있어요. 흐름을 살리는 틈을 찾아보세요.'}$('prev').onclick=()=>{i--;render()};$('next').onclick=()=>{i++;render()};$('notes').onclick=()=>$('memo').classList.toggle('hidden');$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();function tick(){remaining=Math.max(0,remaining-1);$('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')+(timer?' · 일시정지':' · 시작');if(!remaining){clearInterval(timer);timer=null}}$('timer').onclick=()=>{if(timer){clearInterval(timer);timer=null}else if(remaining){timer=setInterval(tick,1000)}$('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')+(timer?' · 일시정지':' · 시작')};render();</script></body></html>
