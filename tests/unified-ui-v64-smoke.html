<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Teacher OS v66 end-to-end navigation</title>
<style>html,body{margin:0;width:100%;height:100%;font-family:system-ui}iframe{border:0;width:100%;height:100%}pre{position:fixed;top:0;right:0;background:rgba(255,255,255,.97);z-index:999999;font-size:9px;max-width:520px;max-height:170px;overflow:auto;padding:6px;white-space:pre-wrap}</style>
</head><body><iframe id="teacher-os" src="../?mode=tools" title="Teacher OS"></iframe><pre id="audit" data-status="PENDING">LOADING</pre>
<script>
(function(){
var ticks=0,done=false;
function checkAll(){
 if(done)return;
 var frame=document.getElementById('teacher-os'),d,w;
 try{d=frame.contentDocument;w=frame.contentWindow}catch(e){return}
 if(!d||!d.body||!d.body.classList.contains('teacher66-mode')){
  if(++ticks>100){done=true;var o=document.getElementById('audit');o.dataset.status='FAIL';o.textContent='v66 UI not initialized'}return;
 }
 done=true;
 var trace=[],errs=[],style=w.getComputedStyle.bind(w);
 function check(ok,message){trace.push((ok?'OK ':'FAIL ')+message);if(!ok)errs.push(message)}
 try{
  var groups=[['home','dashboard'],['lesson','timetable'],['assessment','assessment'],['student','studentrecords'],['work','projects']];
  check(d.body.classList.contains('teacher51-mode'),'Preserved global current design');
  check(!!d.querySelector('link[href*="teacher-focused-v65.css"]'),'v66 unified styles loaded');
  check(d.querySelectorAll('#nav>.os66-category').length===5,'Exactly five first-level options');
  check(style(d.getElementById('os66LegacyNav')).display==='none','Old fourteen-button menu is hidden');
  check(!d.getElementById('os65-detail'),'Old all-in-one detailed page removed');
  check(!d.getElementById('t49Workspace'),'Old all-in-one workspace container removed');
  check(d.querySelectorAll('#os65Home .os65-quick-card').length===4,'Four concise home actions');
  check(d.querySelectorAll('#os65Home [data-teacher56="open"]').length===1,'One protected gradebook entry on home');
  check(!!d.getElementById('os65PendingItems')&&!!d.getElementById('os65UpcomingItems'),'Actionable pending and calendar data containers present');
  var placements=[['nextList','calendar'],['agentRun','policy'],['todayTimetable','timetable'],['flowList','assessment'],['taskList','projects'],['taskInput','projects'],['taskAdd','projects'],['policyBanner','policy'],['t49Screen','t49-classes']];
  placements.forEach(function(pair){
   var item=d.getElementById(pair[0]),page=d.getElementById(pair[1]);
   check(!!item&&!!page&&page.contains(item),'Original functional widget relocated: '+pair[0]+' → '+pair[1]);
  });
  check(!!d.querySelector('#timetable .musicLibraryFeatured'),'Music resource shortcut belongs with lessons');
  check(!!d.querySelector('#settings .summary'),'Source configuration metrics belong with settings');
  for(var i=0;i<groups.length;i++){
   var g=groups[i],b=d.querySelector('[data-os66-category="'+g[0]+'"]');
   check(!!b&&b.getBoundingClientRect().height>0,'Visible main category '+g[0]);
   if(!b)continue;
   b.click();
   var expected=g[1]==='studentrecords'&&!d.getElementById('studentrecords')?'t49-records':g[1];
   check(!!d.getElementById(expected)&&d.getElementById(expected).classList.contains('active'),'Single-click main category '+g[0]);
   if(g[0]!=='home'){
    var tabs=d.getElementById('os66Tabs');
    check(tabs&&!tabs.hidden&&tabs.querySelectorAll('.os66-tab').length>=2,'Contextual subtabs for '+g[0]);
   }
  }
  var categories={
   lesson:['calendar','policy'],assessment:['t49-classes','t49-exceptions'],
   student:['t49-records'],work:['clubs','memory']
  };
  Object.keys(categories).forEach(function(g){
   d.querySelector('[data-os66-category="'+g+'"]').click();
   categories[g].forEach(function(v){
    var tab=d.querySelector('#os66Tabs [data-os66-view="'+v+'"]');
    check(!!tab&&tab.getBoundingClientRect().height>0,'Visible subtab '+v);
    if(tab){tab.click();check(d.getElementById(v).classList.contains('active'),'Reachable workflow '+v)}
   });
  });
  var settings=d.getElementById('os66SettingsButton');
  check(!!settings&&settings.getBoundingClientRect().height>0,'Settings available in top bar');
  if(settings){
   settings.click();check(d.getElementById('settings').classList.contains('active'),'Settings opens in one click');
   ['documents','importer'].forEach(function(v){
    var tab=d.querySelector('#os66Tabs [data-os66-view="'+v+'"]');
    check(!!tab&&tab.getBoundingClientRect().height>0,'Utility subtab available '+v);
    if(tab){tab.click();check(d.getElementById(v).classList.contains('active'),'Utility tool opens '+v)}
   });
  }
  d.querySelector('[data-os66-category="home"]').click();
  check(d.getElementById('dashboard').classList.contains('active'),'Returns to concise home');
  check(d.getElementById('os66Tabs').hidden,'Home has no distracting subtab bar');
  check(!!d.querySelector('.top-actions #yearSelect'),'Year setting preserved');
  check(!!d.querySelector('#os65TaskForm')&&!!d.querySelector('#taskList'),'Quick add and original task editor both exist');
  var ann=d.querySelector('#t49-classes #t49Screen .t49-panels>.t49-panel:not(:first-child)');
  if(ann)check(style(ann).display==='none','Duplicate old dashboard panels hidden from class progress');
 }catch(e){errs.push('EXCEPTION '+(e&&e.stack||e));trace.push('FAIL EXCEPTION '+String(e))}
 var out=document.getElementById('audit');
 out.dataset.status=errs.length?'FAIL':'PASS';
 out.textContent=(errs.length?'FAIL: '+errs.length+'\n':'PASS: '+trace.length+' checks\n')+trace.join('\n');
}
setInterval(checkAll,280);
})();
</script></body></html>
