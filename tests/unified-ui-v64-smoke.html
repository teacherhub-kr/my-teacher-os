<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Teacher OS focused UX browser audit</title>
<style>html,body{margin:0;width:100%;height:100%;font-family:system-ui}iframe{border:0;width:100%;height:100%}pre{position:fixed;top:0;right:0;background:rgba(255,255,255,.96);z-index:999999;font-size:9px;max-width:520px;max-height:160px;overflow:auto;padding:6px;white-space:pre-wrap}</style>
</head><body><iframe id="teacher-os" src="../?mode=tools" title="Teacher OS UI"></iframe><pre id="audit" data-status="PENDING">LOADING</pre>
<script>
(function(){
var attempts=0,once=false;
function verify(){
  if(once)return;
  var frame=document.getElementById('teacher-os'),d,w;
  try{d=frame.contentDocument;w=frame.contentWindow}catch(e){return}
  if(!d||!d.body||!d.body.classList.contains('teacher65-mode')||!d.getElementById('os65Home')){
    if(++attempts>150){document.getElementById('audit').textContent='FAIL: modern focused view was not ready';document.getElementById('audit').dataset.status='FAIL'}
    return;
  }
  once=true;
  var errors=[],trace=[],style=w.getComputedStyle.bind(w);
  function check(ok,message){if(!ok)errors.push(message);trace.push((ok?'OK ':'FAIL ')+message)}
  try{
    var menus=['dashboard','os65-detail','importer','calendar','timetable','assessment','clubs','projects','policy','documents','memory','settings','t49-classes','t49-exceptions','t49-records'];
    var groups=['home','lesson','record','work','tools'];
    check(d.body.classList.contains('teacher51-mode'),'Existing unified theme initialized');
    check(!!d.querySelector('link[href*="teacher-focused-v65.css"]'),'Focused style loaded');
    check(!!d.querySelector('link[href*="teacher-unified-v64.css"]'),'Existing stylesheet retained');
    check(!d.getElementById('t49Legacy'),'Old collapsible interface removed');
    check(d.querySelectorAll('#nav>.os65-group').length===5,'Exactly five primary workflow groups');
    groups.forEach(function(g){
      var header=d.getElementById('os65-toggle-'+g),list=d.getElementById('os65-group-'+g);
      check(!!header&&!!list&&header.getBoundingClientRect().height>0,'Primary workflow group visible: '+g);
    });
    var home=d.getElementById('os65Home'),detail=d.getElementById('os65-detail');
    check(!!home&&d.getElementById('dashboard').contains(home),'Focused home is the real dashboard');
    check(!!detail&&detail.contains(d.getElementById('dashboardBody')),'Original app engine preserved as a first-class detail view');
    check(!d.getElementById('dashboard').contains(d.getElementById('t49Workspace')),'Old giant dashboard removed from first page');
    check(d.querySelectorAll('#os65Home .os65-quick-card').length===4,'Home has only four primary tasks');
    check(d.querySelectorAll('#os65Home [data-teacher56="open"]').length===1,'Only one secure grade link on focused home');
    check(!!d.getElementById('os65PendingItems')&&!!d.getElementById('os65UpcomingItems'),'Pending work and upcoming deadlines visible');
    var workspace=d.getElementById('t49Workspace');
    for(var j=0,ids=['nextList','agentRun','todayTimetable','flowList','taskList','taskInput','taskAdd','mEnv','mCal','mTT','mAss','mClub','mProj'];j<ids.length;j++){
      var widget=d.getElementById(ids[j]);
      check(!!widget&&workspace.contains(widget),'Original live widget preserved: '+ids[j]);
    }
    for(var i=0;i<menus.length;i++){
      var view=menus[i],button=d.querySelector('#nav button[data-view="'+view+'"]');
      check(!!button&&!!button.closest('.os65-group'),'Workflow remains in navigation: '+view);
      if(!button)continue;
      var parent=button.closest('.os65-group');
      parent.querySelector('button[data-os65-group]').click();
      if(view!=='dashboard')check(button.getBoundingClientRect().height>0,'Workflow can be revealed: '+view);
      button.click();
      var section=d.getElementById(view);
      check(!!section&&section.classList.contains('active')&&style(section).display!=='none','Workflow navigates correctly: '+view);
    }
    var agent=d.querySelector('.t49-workspace .agent');
    if(agent)check(style(agent).backgroundColor==='rgb(255, 255, 255)','Old green agent card replaced');
    d.querySelector('#os65-toggle-home').click();
    check(d.getElementById('dashboard').classList.contains('active'),'Return to focused home');
    check(style(d.querySelector('.top-actions')).display!=='none','Academic year actions still accessible');
    // Perform one real user workflow through the unchanged v05 data engine.
    var newYear=d.getElementById('newYear');
    newYear.click();
    check(d.getElementById('yearDlg').open,'Original academic year form works');
    d.getElementById('yYear').value='2026';
    d.getElementById('yearForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
    var raw=JSON.parse(w.localStorage.getItem('myTeacherOS.v01')||'{}');
    check(!!(raw.years&&raw.years['2026']),'Original year record saved to same localStorage key');
    var homeInput=d.getElementById('os65NewTask');
    homeInput.value='가상 업무 검증';
    d.getElementById('os65TaskForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
    raw=JSON.parse(w.localStorage.getItem('myTeacherOS.v01')||'{}');
    var tasks=raw.years&&raw.years['2026']&&raw.years['2026'].tasks||[];
    check(tasks.some(function(t){return t.text==='가상 업무 검증'&&!t.done}),'Focused task form uses the original save handler');
    var checkbox=d.querySelector('#os65PendingItems [data-os65-complete]');
    check(!!checkbox,'Saved task is visible on the focused home');
    if(checkbox){
      checkbox.click();
      raw=JSON.parse(w.localStorage.getItem('myTeacherOS.v01')||'{}');
      tasks=raw.years&&raw.years['2026']&&raw.years['2026'].tasks||[];
      check(tasks.some(function(t){return t.text==='가상 업무 검증'&&t.done}),'Task completion persists through original data handler');
    }
    check(style(d.querySelector('.os65-focus-grid')).display==='grid','Focused task panels use the new design');
  }catch(err){errors.push('EXCEPTION: '+(err&&err.stack||err));trace.push('FAIL: '+String(err))}
  var output=document.getElementById('audit');
  output.dataset.status=errors.length?'FAIL':'PASS';
  output.textContent=(errors.length?'FAIL: '+errors.length+'\n':'PASS: '+trace.length+' checks\n')+trace.join('\n');
}
setInterval(verify,300);setTimeout(verify,2200);
})();
</script></body></html>
