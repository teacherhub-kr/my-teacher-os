name: Teacher OS v64 Unified Design Guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'teacher-unified-v64.css'
      - 'teacher-focused-v65.js'
      - 'teacher-focused-v65.css'
      - 'teacher-dashboard-v49.js'
      - 'tests/focused-workflow-v65.test.js'
      - 'teacher-dashboard-v49.css'
      - 'teacher-design-v51.css'
      - 'teacher-dashboard-v49.js'
      - 'tests/unified-*.test.js'
      - 'tests/unified-ui-v64-smoke.html'
      - '.github/workflows/v64-unified-design.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'teacher-unified-v64.css'
      - 'teacher-focused-v65.js'
      - 'teacher-focused-v65.css'
      - 'teacher-dashboard-v49.js'
      - 'tests/focused-workflow-v65.test.js'
      - 'tests/unified-*.test.js'
      - 'tests/unified-ui-v64-smoke.html'
      - '.github/workflows/v64-unified-design.yml'
permissions:
  contents: read
jobs:
  visual-and-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify design and existing functionality
        run: |
          set -euo pipefail
          node tests/unified-design-v64.test.js
          node --check teacher-focused-v65.js
          node tests/focused-workflow-v65.test.js
          node tests/integrated-workspace-v63.test.js
          node tests/teacher-activity-home-v61.test.js
          node tests/owner-portal-v56.test.js
      - name: Browser smoke — unified desktop and mobile
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8564 --bind 127.0.0.1 >/tmp/teacher-v64-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          for size in 1672,941 390,844; do
            if ! timeout 50s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --disable-extensions --window-size="$size" --virtual-time-budget=16000 \
              --dump-dom "http://127.0.0.1:8564/tests/unified-ui-v64-smoke.html?ci=true" \
              >"/tmp/teacher-v64-${size}.html" 2>"/tmp/teacher-v64-${size}.log"; then
              echo "Browser did not complete at $size"; tail -70 "/tmp/teacher-v64-${size}.log";
              tail -c 1500 "/tmp/teacher-v64-${size}.html"; exit 1;
            fi
            python3 - "$size" <<'PY'
          import sys,re,html
          size=sys.argv[1]
          doc=open('/tmp/teacher-v64-'+size+'.html',encoding='utf8').read()
          marker=re.search(r'<pre id="audit" data-status="(\w+)"[^>]*>(.*?)</pre>',doc,re.S)
          assert marker, 'Browser audit report missing ('+size+')'
          content=html.unescape(marker.group(2))
          print('VIEWPORT',size,'STATUS',marker.group(1))
          print(content[:3500])
          assert marker.group(1)=='PASS','Visual/interaction regression at '+size+': '+content[:1200]
          PY
          done
          timeout 50s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1672,941 --virtual-time-budget=12000 \
            --screenshot=teacher-os-v64-desktop.png http://127.0.0.1:8564/tests/unified-ui-v64-smoke.html \
            >/tmp/teacher-v64-shot.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-teacher-os-v64-desktop-visual-check
          path: teacher-os-v64-desktop.png
          if-no-files-found: ignore
          retention-days: 7
