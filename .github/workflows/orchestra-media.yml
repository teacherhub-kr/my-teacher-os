name: Orchestra Classroom Media Validation & Publish
on:
  push:
    branches: [main]
    paths:
      - 'lessons/orchestra-timbre/asset-loader.py'
      - '.github/workflows/orchestra-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image checks and FFmpeg
        run: |
          python -m pip install Pillow
          ffmpeg -version
      - name: Fetch and verify 14 photos plus 14 real performances
        run: python lessons/orchestra-timbre/asset-loader.py
      - name: Verify JS parses and all local audio images are present
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('lessons/orchestra-timbre/assets')
          jpg=list(p.glob('*.jpg'))
          media=list(p.glob('*.ogg'))+list(p.glob('*.mp3'))
          assert len(jpg)==14, len(jpg)
          assert len(media)==14, len(media)
          for j in jpg:
              with Image.open(j) as im: im.verify()
          for a in media: assert a.stat().st_size>2000, a
          print('ALL 14 PHOTO AND AUDIO FILES PRESENT')
          PY
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('lessons/orchestra-timbre/index.html','utf8');
          for(const [,script] of html.matchAll(/<script>([\s\S]*?)<\/script>/g)){new Function(script)}
          console.log('ALL INLINE JAVASCRIPT PARSES');
          JS
      - name: Commit validated media and updated lesson atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons/orchestra-timbre
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified real instrument audio, photos and classroom UI'
          git push
