name: Teacher OS runtime asset guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed runtime
        uses: actions/checkout@v4
      - name: Verify all public runtime asset references and loader anchors
        run: node tests/live-loader-assets.test.js
      - name: Keep private dashboard routing secure
        run: node tests/owner-entry-v58.test.js
      - name: Keep current five-workspace integration intact
        run: node tests/workflow-v66.test.js
