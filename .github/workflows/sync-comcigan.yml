name: Sync Comcigan timetable

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync-comcigan.mjs'
      - 'scripts/comcigan-diagnostics.mjs'
      - 'scripts/comcigan-runtime-diag.mjs'
      - 'scripts/comcigan-crosscheck.mjs'
      - 'tests/comcigan-crosscheck.test.mjs'
      - 'scripts/comcigan-deadline.mjs'
      - 'tests/comcigan-deadline.test.mjs'
      - 'scripts/comcigan-teacher-contract.mjs'
      - 'tests/comcigan-teacher-contract.test.mjs'
      - 'tests/comcigan-runtime-diag.test.mjs'
      - 'scripts/comcigan-class-probe.mjs'
      - 'tests/comcigan-class-probe.test.mjs'
      - 'tests/comcigan-failure.test.mjs'
      - '.github/workflows/sync-comcigan.yml'
  schedule:
    - cron: '10 23 * * 0-4' # 08:10 KST Monday-Friday (prior UTC day)
    - cron: '20 3 * * 1-5'  # 12:20 KST Monday-Friday
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'comcigan-config.json'
      - 'scripts/sync-comcigan.mjs'
      - 'scripts/comcigan-diagnostics.mjs'
      - 'tests/comcigan-failure.test.mjs'
      - '.github/workflows/sync-comcigan.yml'

permissions:
  contents: read

concurrency:
  group: comcigan-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Pages deploy dispatch is wired
        run: |
          grep -q 'gh workflow run deploy.yml --ref main' .github/workflows/sync-comcigan.yml
          grep -q 'changed=true' .github/workflows/sync-comcigan.yml

      - name: Check sanitized diagnostic extraction
        shell: bash
        run: |
          result=$(printf '%s\n' 'TEACHER_OS_CLASS_PROBE=ok' | sed -n 's/^TEACHER_OS_CLASS_PROBE=\([a-z,-]*\)$/\1/p')
          test "$result" = "ok"
      - name: Offline syntax and safe-error regression
        run: |
          node --check scripts/sync-comcigan.mjs
          node --check scripts/comcigan-diagnostics.mjs
          node --check scripts/comcigan-runtime-diag.mjs
          node --check scripts/comcigan-teacher-contract.mjs
          node --check scripts/comcigan-deadline.mjs
          node --check scripts/comcigan-crosscheck.mjs
          node --check scripts/comcigan-class-probe.mjs
          node --test tests/comcigan-failure.test.mjs
          node --test tests/comcigan-runtime-diag.test.mjs
          node --test tests/comcigan-teacher-contract.test.mjs
          node --test tests/comcigan-crosscheck.test.mjs
          node --test tests/comcigan-deadline.test.mjs
          node --test tests/comcigan-crosscheck.test.mjs
          node --test tests/comcigan-class-probe.test.mjs

  sync:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned parser
        run: npm install --no-save --ignore-scripts comcigan@3.0.4

      - name: Validate collector syntax
        run: node --check scripts/sync-comcigan.mjs

      - name: Validate teacher API adapter and publication gate
        run: |
          node --check scripts/comcigan-teacher-contract.mjs
          node --test tests/comcigan-teacher-contract.test.mjs

      - name: Validate sanitized collector diagnostics
        run: node --test tests/comcigan-failure.test.mjs

      - name: Fetch teacher timetable
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/sync-comcigan.mjs > /tmp/comcigan-fetch.log 2>&1
          code=$?
          category=runtime
          detail=runtime
          machine_code=$(sed -n 's/^TEACHER_OS_CODE=\([a-z0-9-]*\)$/\1/p' /tmp/comcigan-fetch.log | tail -n 1)
          # Only allow known, sanitized labels. Never print upstream URLs/responses.
          failure_kinds=$(sed -n 's/^TEACHER_OS_FAILURE_KINDS=\([a-z,-]*\)$/\1/p' /tmp/comcigan-fetch.log | tail -n 1)
          case "$failure_kinds" in
            ''|*[!a-z,-]*) failure_kinds=unclassified ;;
          esac
          if [ "$code" -eq 0 ] && [ -f live/comcigan.json ]; then
            category=ok
            detail=ok
          else
            case "$machine_code" in
              teacher-indices-missing|teacher-name-not-found|teacher-name-multiple|teacher-index-name-mismatch|teacher-not-resolved|teacher-data-missing)
                category=teacher-resolution
                detail="$machine_code"
                ;;
              collector-init|collector-fetch)
                category=collector
                detail="$machine_code"
                ;;
              parser-import|parser-export)
                category=parser
                detail="$machine_code"
                ;;
              timetable-empty|timetable-crosscheck|timetable-validation|timetable-too-few|timetable-too-many|timetable-scope|timetable-duplicate-class|timetable-invalid-time|timetable-period-conflict|timetable-nonmusic|timetable-invalid-label|timetable-coverage)
                category=validation
                detail="$machine_code"
                ;;
              config-invalid)
                category=config
                detail="$machine_code"
                ;;
            esac
          fi
          # A collector-stage failure is not necessarily a network failure.
          if [ "$category" = "collector" ]; then
            case "$failure_kinds" in
              connection|dns|rate-limit|upstream-*) category=network ;;
              parse) category=parser ;;
            esac
          fi
          class_probe=$(sed -n 's/^TEACHER_OS_CLASS_PROBE=\([a-z,-]*\)$/\1/p' /tmp/comcigan-fetch.log | tail -n 1)
          case "$class_probe" in ''|*[!a-z,-]*) class_probe=not-run ;; esac
          echo "class_probe=$class_probe" >> "$GITHUB_OUTPUT"
          error_origin=$(sed -n 's/^TEACHER_OS_FAILURE_ORIGINS=\([a-z0-9,-]*\)$/\1/p' /tmp/comcigan-fetch.log | tail -n 1)
          case "$error_origin" in ''|*[!a-z0-9,-]*) error_origin=unknown ;; esac
          echo "error_origin=$error_origin" >> "$GITHUB_OUTPUT"
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "failure_kinds=$failure_kinds" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            case "$machine_code" in
              config-invalid|teacher-indices-missing|teacher-name-not-found|teacher-name-multiple|teacher-index-name-mismatch|teacher-not-resolved|teacher-data-missing|timetable-empty|timetable-crosscheck|timetable-validation|timetable-too-few|timetable-too-many|timetable-scope|timetable-duplicate-class|timetable-invalid-time|timetable-period-conflict|timetable-nonmusic|timetable-invalid-label|timetable-coverage|collector-init|collector-fetch|parser-import|parser-export)
                echo "Sanitized collector stage: $machine_code" ;;
              *) echo "Sanitized collector stage: unknown" ;;
            esac
            echo "Sanitized collector failure kinds: $failure_kinds"
            echo "Sanitized independent class probe: $class_probe"
            echo "Sanitized upstream error site: $error_origin"
            crosscheck=$(sed -n 's/^TEACHER_OS_CROSSCHECK=\([a-z-]*\)$/\1/p' /tmp/comcigan-fetch.log | tail -n 1)
            case "$crosscheck" in ''|*[!a-z-]*) crosscheck=unknown ;; esac
            echo "Sanitized cross-view check: $crosscheck"
          fi
          exit "$code"

      - name: Record sanitized collector health
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          FETCH_CATEGORY: ${{ steps.fetch.outputs.category }}
          FETCH_DETAIL: ${{ steps.fetch.outputs.detail }}
          FETCH_FAILURE_KINDS: ${{ steps.fetch.outputs.failure_kinds }}
        run: |
          mkdir -p live
          if [ "$FETCH_OUTCOME" = "success" ] && [ -f live/comcigan.json ]; then
            printf '%s\n' '{"status":"ok","category":"ok","detail":"ok","verification":"teacher-class-match"}' > live/comcigan-status.json
          else
            printf '%s\n' "{\"status\":\"error\",\"category\":\"${FETCH_CATEGORY:-runtime}\",\"detail\":\"${FETCH_DETAIL:-runtime}\",\"failureKinds\":\"${FETCH_FAILURE_KINDS:-unclassified}\"}" > live/comcigan-status.json
          fi

      - name: Commit live state only when changed
        id: commit
        run: |
          git config user.name "teacher-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/comcigan-status.json
          if [ -f live/comcigan.json ]; then git add live/comcigan.json; fi
          if git diff --cached --quiet; then
            echo "No Comcigan state change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update live Comcigan state"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated timetable to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Fail workflow when collection failed
        if: steps.fetch.outcome != 'success'
        run: exit 1
