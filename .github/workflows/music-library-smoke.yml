name: Music Library Integration Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'tests/music-library-smoke.mjs'
      - '.github/workflows/music-library-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'tests/music-library-smoke.mjs'
      - '.github/workflows/music-library-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium --only-shell
      # Avoid downloading the same large Wikimedia tracks twice back-to-back
      # from one GitHub Actions runner; media playback is required on PUBLIC Pages.
      - name: Start temporary site server and test OS, catalog, lesson
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/music-library-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/lessons/catalog.json >/dev/null; then break; fi
            sleep 1
          done
          node tests/music-library-smoke.mjs
      - name: Verify published Arirang unified pilot
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://teacherhub-kr.github.io/my-teacher-os/lessons/arirang-vocal/unified-pilot.html';
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(12000) });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const html = await response.text();
              for (const marker of ['MY MUSIC CLASS', 'const scenes=[', '아리랑', 'id="activity"', 'id="next"']) {
                if (!html.includes(marker)) throw new Error('Missing pilot marker: ' + marker);
              }
              console.log('Published Arirang unified pilot verified:', url);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log('Attempt ' + attempt + '/12:', error.message);
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          throw lastError;
          NODE
      - name: Verify published GitHub Pages website
        if: github.event_name == 'push'
        env:
          MUSIC_LIB_BASE_URL: https://teacherhub-kr.github.io/my-teacher-os
          MUSIC_LIB_REQUIRE_MEDIA: '1'
          MUSIC_LIB_EXPECTED_SHA: ${{ github.sha }}
        run: node tests/music-library-smoke.mjs
