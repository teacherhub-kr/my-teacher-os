name: Music Library Integration Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'tests/music-library-smoke.mjs'
      - '.github/workflows/music-library-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'tests/music-library-smoke.mjs'
      - '.github/workflows/music-library-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium --only-shell
      - name: Start temporary site server and test OS, catalog, lesson
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/music-library-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/lessons/catalog.json >/dev/null; then break; fi
            sleep 1
          done
          MUSIC_LIB_REQUIRE_MEDIA=1 node tests/music-library-smoke.mjs
      - name: Verify published GitHub Pages website
        if: github.event_name == 'push'
        env:
          MUSIC_LIB_BASE_URL: https://teacherhub-kr.github.io/my-teacher-os
          MUSIC_LIB_REQUIRE_MEDIA: '1'
        run: node tests/music-library-smoke.mjs
