name: Music Seven-Lesson Hybrid Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'tests/music-presenter-seven.spec.cjs'
      - '.github/workflows/music-presenter-seven.yml'
  push:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'tests/music-presenter-seven.spec.cjs'
      - '.github/workflows/music-presenter-seven.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared JavaScript and all seven links
        run: |
          set -euo pipefail
          node --check lessons/hybrid-v2/engine.js
          node tests/music-hybrid-story-check.mjs
          test -f lessons/hybrid-v2/deck.css
          test -f lessons/hybrid-v2/story-theme.css
          test -f lessons/hybrid-v2/teacher-guide.html
          for id in orchestra-timbre rhythm-lab dynamics-expression gayageum-observation vocal-breath-phrasing bali-gamelan-archive arirang-vocal; do
            grep -q "hybrid-v2/deck.css" "lessons/$id/index.html"
            grep -q "hybrid-v2/engine.js" "lessons/$id/index.html"
            grep -q "data-music-lesson=\"$id\"" "lessons/$id/index.html"
            test -f "lessons/$id/teacher.html"
            test -f "lessons/$id/deck.json"
          done
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run hybrid lesson browser and visual story tests
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/music-presenter-seven-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4173/lessons/catalog.json >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/music-presenter-seven.spec.cjs --reporter=line --workers=1
