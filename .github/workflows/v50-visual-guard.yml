name: Teacher OS v50 Visual DOM Guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'teacher-dashboard-v49.js'
      - 'teacher-dashboard-v49.css'
      - 'teacher-hero-v50.svg'
      - 'tests/v49-tests.js'
      - 'tests/v50-tests.js'
      - '.github/workflows/v50-visual-guard.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'teacher-dashboard-v49.js'
      - 'teacher-dashboard-v49.css'
      - 'teacher-hero-v50.svg'
      - 'tests/v50-tests.js'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax and static regressions
        run: |
          set -euo pipefail
          node --check teacher-dashboard-v49.js
          node tests/v49-tests.js
          node tests/v50-tests.js
      - name: Install Korean fonts for faithful screenshot comparison
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Chromium rendered DOM smoke test — first-time setup
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8432 --bind 127.0.0.1 > /tmp/teacheros-server.log 2>&1 &
          pid=$!
          trap "kill $pid || true" EXIT
          sleep 2
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --disable-extensions --disable-background-networking \
            --window-size=1460,950 --virtual-time-budget=12000 --dump-dom \
            http://127.0.0.1:8432/ > /tmp/teacheros-v50-dom.html 2>/tmp/teacheros-chrome.log
          python3 - <<'PY'
          import re
          doc=open('/tmp/teacheros-v50-dom.html',encoding='utf-8').read()
          for item in ['id="t49Screen"','id="t49SetupBanner"','class="t49-kpis"','teacher49-mode','학년도 시작']:
              assert item in doc, f"Rendered home missing: {item}"
          assert re.search(r'id="dashboardBody"[^>]*style="[^"]*display:\s*block',doc), 'No-year dashboard still hidden!'
          print('Chromium smoke OK: new dashboard and onboarding visible before year selection.')
          PY
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --disable-extensions --window-size=1460,950 \
            --virtual-time-budget=8000 --screenshot=teacheros-v50-ci-preview.png \
            http://127.0.0.1:8432/ >/dev/null 2>/tmp/teacheros-screenshot-chrome.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacheros-v50-screenshot
          path: teacheros-v50-ci-preview.png
          if-no-files-found: ignore
          retention-days: 3
