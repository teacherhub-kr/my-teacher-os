name: Diagnose GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - diagnostics/pages-trigger.txt

permissions:
  contents: write
  pages: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read sanitized Pages and deploy diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          H1="Accept: application/vnd.github+json"
          H2="Authorization: Bearer $GH_TOKEN"
          H3="X-GitHub-Api-Version: 2026-03-10"

          curl -sS -H "$H1" -H "$H2" -H "$H3" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?per_page=5" > /tmp/deploy-runs.json || printf '{"workflow_runs":[]}\n' > /tmp/deploy-runs.json
          RUN_ID=$(jq -r '.workflow_runs[0].id // empty' /tmp/deploy-runs.json)
          jq '{runId:(.workflow_runs[0].id // null),status:(.workflow_runs[0].status // "unknown"),conclusion:(.workflow_runs[0].conclusion // null),headSha:(.workflow_runs[0].head_sha // null),createdAt:(.workflow_runs[0].created_at // null),updatedAt:(.workflow_runs[0].updated_at // null)}' /tmp/deploy-runs.json > diagnostics/deploy-status.json

          if [ -n "$RUN_ID" ]; then
            curl -sS -H "$H1" -H "$H2" -H "$H3" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" > /tmp/deploy-jobs.json || printf '{"jobs":[]}\n' > /tmp/deploy-jobs.json
            jq '{jobs:[.jobs[]? | {name,status,conclusion,steps:[.steps[]? | {name,status,conclusion}]}]}' /tmp/deploy-jobs.json > diagnostics/deploy-jobs.json
          else
            printf '{"jobs":[]}\n' > diagnostics/deploy-jobs.json
          fi

          ROOT_STATUS=$(curl -L -sS -o /tmp/live-root.html -w '%{http_code}' 'https://teacherhub-kr.github.io/' || true)
          PROJECT_STATUS=$(curl -L -sS -o /tmp/live-project.html -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/' || true)
          V32_STATUS=$(curl -L -sS -o /tmp/live-v32.js -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/app-v32.js' || true)
          V32CSS_STATUS=$(curl -L -sS -o /tmp/live-v32.css -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/app-v32.css' || true)
          CORE31_STATUS=$(curl -L -sS -o /tmp/live-core-v31.js -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/core-v31.js' || true)
          V31_STATUS=$(curl -L -sS -o /tmp/live-v31.js -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/app-v31.js' || true)
          V31CSS_STATUS=$(curl -L -sS -o /tmp/live-v31.css -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/app-v31.css' || true)
          CORE30_STATUS=$(curl -L -sS -o /tmp/live-core-v30.js -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/core-v30.js' || true)
          V30_STATUS=$(curl -L -sS -o /tmp/live-v30.js -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/app-v30.js' || true)
          V30CSS_STATUS=$(curl -L -sS -o /tmp/live-v30.css -w '%{http_code}' 'https://teacherhub-kr.github.io/my-teacher-os/app-v30.css' || true)
          INDEX_HAS_V32=$(grep -q 'app-v32.js' /tmp/live-project.html && grep -q 'app-v32.css' /tmp/live-project.html && echo true || echo false)
          printf '{"root":"%s","project":"%s","v32":"%s","v32css":"%s","core31":"%s","v31":"%s","v31css":"%s","core30":"%s","v30":"%s","v30css":"%s","indexHasV32":%s}\n' "$ROOT_STATUS" "$PROJECT_STATUS" "$V32_STATUS" "$V32CSS_STATUS" "$CORE31_STATUS" "$V31_STATUS" "$V31CSS_STATUS" "$CORE30_STATUS" "$V30_STATUS" "$V30CSS_STATUS" "$INDEX_HAS_V32" > diagnostics/live-http-status.json
          printf '{"checkedAt":"%s","sha":"%s","latestRunId":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$RUN_ID" > diagnostics/pages-check.json

          rm -f diagnostics/pages-site.json diagnostics/pages-build-latest.json diagnostics/deploy-runs.json diagnostics/deploy-latest-jobs.json diagnostics/live-project-head.txt

      - name: Commit sanitized diagnostics
        run: |
          git config user.name "teacher-os-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add -A diagnostics
          if git diff --cached --quiet; then
            echo "No diagnostics change"
          else
            git commit -m "Record sanitized Pages diagnostics"
            git push
          fi
