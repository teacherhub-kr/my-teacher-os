name: Teacher OS Quality Guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/quality-guard.yml'
      - 'scripts/public-audio-privacy-guard.cjs'
      - 'tests/public-audio-privacy-guard.test.cjs'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-os-quality-guard
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regression tests
        run: |
          set -euo pipefail
          node tests/core-tests.js
          node tests/v06-tests.js
          node tests/v07-tests.js
          node tests/v08-tests.js
          node tests/v09-tests.js
          node tests/v10-tests.js
          node tests/v11-tests.js
          node tests/v12-tests.js
          node tests/v13-tests.js
          node tests/v14-tests.js
          node tests/v15-tests.js
          node tests/v16-tests.js
          node tests/v17-tests.js
          node tests/v18-tests.js
          node tests/v19-tests.js
          node tests/v20-tests.js
          node tests/v21-tests.js
          node tests/v22-tests.js
          node tests/v23-tests.js
          node tests/v24-tests.js
          node tests/v25-tests.js
          node tests/v26-tests.js
          node tests/v27-tests.js
          node tests/v28-tests.js
          node tests/v29-tests.js
          node tests/v30-tests.js
          node tests/v31-tests.js
          node tests/v32-tests.js

      - name: JavaScript syntax guard
        run: |
          set -euo pipefail
          for f in app-v07.js app-v08.js app-v09.js app-v10.js app-v11.js app-v12.js app-v13.js app-v14.js app-v15.js app-v16.js app-v17.js app-v18.js app-v19.js app-v20.js app-v21.js app-v22.js app-v23.js app-v24.js app-v25.js app-v26.js app-v27.js app-v28.js app-v29.js app-v30.js app-v31.js app-v32.js core-v23.js core-v25.js core-v27.js core-v28.js core-v29.js core-v30.js core-v31.js core-v09.js seed-v07.js scripts/sync-comcigan.mjs; do
            node --check "$f"
          done

      - name: Real-device local vault self-test guard
        run: |
          set -euo pipefail
          grep -q "myTeacherOS.deviceStorageSelfTest.v1" app-v32.js
          grep -q "myTeacherOS.sourceVault" app-v32.js
          grep -q "objectStore(STORE).put(record)" app-v32.js
          grep -q "objectStore(STORE).get(key)" app-v32.js
          grep -q "objectStore(STORE).delete(key)" app-v32.js
          grep -q "restored!==payload||restoredDigest!==digest" app-v32.js
          grep -q "opt.disabled=!passed" app-v32.js
          grep -q "select.value='reference'" app-v32.js
          grep -q "IndexedDB 쓰기·읽기·무결성·삭제 통과" app-v32.js
          ! grep -q "fetch(" app-v32.js
          grep -q 'app-v32.js' index.html
          grep -q 'app-v32.css' index.html

      - name: Source retention and local vault guard
        run: |
          set -euo pipefail
          grep -q "IMPORTANT_CLASSES" core-v31.js
          grep -q "assessment','admin','club','schoolplan" core-v31.js
          grep -q "myTeacherOS.sourceVault" app-v31.js
          grep -q "indexedDB.open" app-v31.js
          grep -q "navigator.storage?.estimate" app-v31.js
          grep -q "navigator.storage.persist" app-v31.js
          grep -q "원본 미보관 · 분석 후 해제" app-v31.js
          grep -q "출처·해시·버전만 보관" app-v31.js
          grep -q "이 기기에 원본도 보관" app-v31.js
          grep -q "JSON 백업에도 원본 Blob은 포함하지 않습니다" app-v31.js
          grep -q "로컬 원본 전체 삭제" app-v31.js
          ! grep -q "fetch(" app-v31.js

      - name: Document version lineage guard
        run: |
          set -euo pipefail
          grep -q 'familyKey' core-v30.js
          grep -q 'explicit-version' core-v30.js
          grep -q 'revision-marker' core-v30.js
          grep -q 'same-name-different-content' core-v30.js
          grep -q '새 파일을 최신본으로 사용' app-v30.js
          grep -q '기존 파일 유지' app-v30.js
          grep -q "input.value=''" app-v30.js
          grep -q 'myTeacherOS.importVersionHistory.v1' app-v30.js

      - name: Verified data-state guard
        run: |
          set -euo pipefail
          grep -q 'nextLessonTruth' core-v29.js
          grep -q '오늘 수업 여부를 확정할 수 없습니다' app-v29.js
          grep -q '0건으로 처리하지 않습니다' app-v29.js

      - name: Precision UX guard
        run: |
          set -euo pipefail
          grep -q "ㄱㄲㄴㄷ" core-v28.js
          grep -q "TextEncoder" core-v28.js
          grep -q "bytes:900" core-v28.js
          grep -q "bytes:1500" core-v28.js
          grep -q "Number(year)===2026" core-v28.js
          grep -q "해당 연도 공식 한도 확인 필요" app-v28.js
          grep -q "NEIS 입력 한도를 초과" app-v28.js
          grep -q "myTeacherOS.calendarEditHistory.v1" app-v28.js
          grep -q "myTeacherOS.staffContacts.v1" app-v28.js

      - name: Teacher Desk accuracy and privacy guard
        run: |
          set -euo pipefail
          grep -q '기본 교시시간 기준(예상)' app-v27.js
          grep -q 'myTeacherOS.staffContacts.v1' app-v27.js
          grep -q '연락처는 이 브라우저에만 저장' app-v27.js
          grep -q '없는 내용을 만들어내지 않습니다' app-v27.js
          ! grep -q 'fetch(' app-v27.js
          grep -q 'lessonContext' core-v27.js
          grep -q 'messageDigest' core-v27.js

      - name: Tester feedback guard
        run: |
          set -euo pipefail
          grep -q 'myTeacherOS.feedbackReports.v1' app-v26.js
          grep -q '학생 이름·상담내용·전화번호' app-v26.js
          grep -q 'navigator.share' app-v26.js
          grep -q 'issues/new' app-v26.js

      - name: School-record quality guard
        run: |
          set -euo pipefail
          grep -q 'NO_EVIDENCE' core-v25.js
          grep -q 'PROHIBITED' core-v25.js
          grep -q 'UNSUPPORTED' core-v25.js
          grep -q '합격 가능성 점수' app-v25.js
          grep -q '교육부' school-record-quality-library.json

      - name: Personal isolation guard
        run: |
          set -euo pipefail
          grep -q "readLocalConfig()||blankConfig()" app-v14.js
          ! grep -q "fetch('./comcigan-config.json" app-v14.js
          grep -q "if(!completeConfig(config))" app-v14.js
          grep -q "myTeacherOS.deviceProfile.v1" app-v24.js

      - name: Document intelligence guard
        run: |
          set -euo pipefail
          grep -q 'PP-OCRv5' app-v23.js
          grep -q 'pdf-hybrid-layout+ocr' app-v23.js
          grep -q 'feedbackSignature' app-v23.js
          grep -q '학생자료는 자동 적용 차단' app-v23.js

      - name: Mobile layout guard
        run: |
          set -euo pipefail
          grep -q '@media(max-width:680px)' app-v32.css
          grep -q '@media(max-width:680px)' app-v31.css
          grep -q '@media(max-width:680px)' app-v30.css
          grep -q '@media(max-width:680px)' app-v28.css
          grep -q '@media(max-width:680px)' app-v27.css
          grep -q '@media(max-width:680px)' app-v26.css
          grep -q '@media(max-width:780px)' app-v25.css
          grep -q '@media(max-width:680px)' app-v24.css
          grep -q 'height:auto!important' app-v20.css
          grep -q 'max-height:76px!important' app-v20.css
          grep -q 'safe-area-inset-bottom' app-v20.css

      - name: Public-repo privacy guard
        run: |
          set -euo pipefail
          node --test tests/public-audio-privacy-guard.test.cjs
          node scripts/public-audio-privacy-guard.cjs

      - name: Live site smoke test
        run: |
          set -euo pipefail
          base='https://teacherhub-kr.github.io/my-teacher-os'
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/" >/dev/null
          if curl --fail --silent --show-error "$base/" | grep -q 'app-v32.js'; then
            curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v32.js" >/dev/null
            curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v32.css" >/dev/null
          fi
          if curl --fail --silent --show-error "$base/" | grep -q 'core-v31.js'; then
            curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/core-v31.js" >/dev/null
            curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v31.js" >/dev/null
            curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v31.css" >/dev/null
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/core-v30.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v30.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v30.css" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/core-v29.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v29.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/core-v28.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v28.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v28.css" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/core-v27.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v27.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v27.css" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v26.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/core-v25.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v25.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v24.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v23.js" >/dev/null

      - name: Quality summary
        if: always()
        run: |
          {
            echo '## Teacher OS Quality Guard'
            echo ''
            echo '- Regression tests through v0.32: checked'
            echo '- JavaScript syntax through v0.32: checked'
            echo '- Per-device IndexedDB write/read/integrity/delete self-test and fail-safe fallback: checked'
            echo '- Three-tier source retention, local IndexedDB vault, quota guard and raw-file purge: checked'
            echo '- Document family/version comparison, conservative replacement, source-file release and undo: checked'
            echo '- Unverified timetable vs confirmed zero lessons: checked'
            echo '- Korean initial-consonant search, 2026 NEIS UTF-8 byte guard, calendar undo: checked'
            echo '- Teacher Desk countdown accuracy labels and local-only contacts/text tools: checked'
            echo '- Tester feedback loop and privacy warning: checked'
            echo '- Grounded school-record quality guard: checked'
            echo '- Per-browser personal isolation and Comcigan blocking: checked'
            echo '- Document Intelligence OCR/classifier safety: checked'
            echo '- Mobile responsive latest layers: checked'
            echo '- Public repository audio privacy: checked'
            echo '- GitHub Pages latest wired assets: checked'
          } >> "$GITHUB_STEP_SUMMARY"
